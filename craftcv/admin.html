<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<!-- Add to Home Screen: opens like an app, with its own icon -->
<link rel="manifest" href="/admin.webmanifest">
<link rel="apple-touch-icon" href="/admin-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CVM Admin">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#14142B">
<title>CVMaster Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --night:#14142B;--night2:#1d1d3a;--night3:#2a2a4d;
  --ac:#4338CA;--ac2:#3730a3;--ac-lt:#EEF0FF;--ac-ring:rgba(67,56,202,.18);
  --bg:#F5F5F8;--s1:#FFFFFF;--s2:#F2F2F7;--b1:#EBEBF2;--b2:#D9D9E4;--fill:rgba(20,20,43,.045);--fill2:rgba(20,20,43,.08);
  --t1:#14142B;--t2:#55556F;--t3:#8A8AA3;
  --green:#16A34A;--green-lt:#E9F8EF;--amber:#B45309;--amber-lt:#FEF5E7;--red:#DC2626;--red-lt:#FDECEC;--sky:#0369A1;--sky-lt:#E8F4FB;
  --r:12px;--f:'Plus Jakarta Sans',-apple-system,Segoe UI,sans-serif;
  --shadow:0 1px 2px rgba(20,20,43,.04),0 2px 8px rgba(20,20,43,.04);
  --shadow-md:0 1px 2px rgba(20,20,43,.04),0 8px 24px rgba(20,20,43,.06);
  --shadow-lg:0 2px 6px rgba(20,20,43,.04),0 18px 44px rgba(20,20,43,.10);
  --ease:cubic-bezier(.2,.8,.2,1);
}
html,body{height:100%;background:var(--bg);color:var(--t1);font-family:var(--f);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
a{color:var(--ac)}

/* ── Shell ── */
.app{display:flex;height:100vh;overflow:hidden}
.sb{width:236px;background:var(--night);color:#C7C7E0;display:flex;flex-direction:column;flex-shrink:0}
.sb-head{display:flex;align-items:center;gap:10px;padding:20px 18px 18px}
.sb-logo{display:flex}.sb-logo svg{display:block;height:24px;width:auto}
.sb-tag{margin-left:auto;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#A5B4FC;background:rgba(165,180,252,.12);padding:3px 8px;border-radius:99px}
.sb-nav{flex:1;padding:6px 10px;display:flex;flex-direction:column;gap:2px}
.nav{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;color:#C7C7E0;font-size:14px;font-weight:600;border:none;background:none;text-align:left;width:100%}
.nav:hover{background:var(--night2);color:#fff}
.nav.on{background:var(--night3);color:#fff}
.nav svg{width:18px;height:18px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav .count{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--ac);color:#fff;font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
.sb-foot{padding:14px 16px;border-top:1px solid rgba(255,255,255,.07);display:flex;align-items:center;gap:10px}
.sb-av{width:32px;height:32px;border-radius:50%;background:var(--night3);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sb-mail{flex:1;min-width:0;font-size:12.5px;color:#C7C7E0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-out{border:none;background:none;color:#8A8AA3;padding:6px;border-radius:8px}
.sb-out:hover{color:#fff;background:var(--night2)}
.sb-out svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}

.main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{height:64px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 28px;background:var(--s1);border-bottom:1px solid var(--b1);flex-shrink:0}
.top h1{font-size:18px;font-weight:800;letter-spacing:-.02em}
.top p{font-size:12.5px;color:var(--t3)}
.top-r{display:flex;align-items:center;gap:8px}
.content{flex:1;overflow-y:auto;padding:24px 28px 40px}
.content.flush{padding:0;overflow:hidden;display:flex}

/* ── Controls ── */
.btn{height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--b1);background:var(--s1);color:var(--t1);font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover:not(:disabled){border-color:var(--b2);background:var(--s2)}
.btn-primary{background:var(--ac);border-color:var(--ac);color:#fff}
.btn-primary:hover:not(:disabled){background:var(--ac2);border-color:var(--ac2)}
.btn-danger{color:var(--red)}
.btn-danger:hover:not(:disabled){background:var(--red-lt);border-color:#F5C2C2}
.btn-ghost{border-color:transparent;background:none;color:var(--t2)}
.btn-sm{height:30px;padding:0 11px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
a.btn{text-decoration:none}
.btn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.inp{height:38px;width:100%;background:var(--s1);border:1px solid var(--b1);border-radius:10px;padding:0 12px;color:var(--t1);font-size:13.5px;font-family:inherit;outline:none;transition:border-color .12s,box-shadow .12s}
textarea.inp{height:auto;padding:10px 12px;line-height:1.55;resize:vertical}
.inp:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--ac-ring)}
.inp::placeholder{color:var(--t3)}
.lbl{display:block;font-size:12.5px;font-weight:600;color:var(--t2);margin-bottom:6px}
.seg{display:inline-flex;background:var(--s2);border:1px solid var(--b1);border-radius:10px;padding:3px;gap:2px}
.seg button{height:28px;padding:0 12px;border:none;border-radius:7px;background:none;font-size:12.5px;font-weight:600;color:var(--t2)}
.seg button.on{background:var(--s1);color:var(--t1);box-shadow:var(--shadow)}
.badge{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:99px;font-size:11.5px;font-weight:700;white-space:nowrap}
.b-gray{background:var(--s2);color:var(--t2)}.b-ac{background:var(--ac-lt);color:var(--ac)}.b-green{background:var(--green-lt);color:var(--green)}
.b-amber{background:var(--amber-lt);color:var(--amber)}.b-red{background:var(--red-lt);color:var(--red)}.b-sky{background:var(--sky-lt);color:var(--sky)}
.spinner{width:18px;height:18px;border:2px solid var(--b1);border-top-color:var(--ac);border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.loading{display:flex;align-items:center;justify-content:center;padding:48px}
.empty{text-align:center;padding:40px 20px;color:var(--t3);font-size:13.5px}
.empty strong{display:block;color:var(--t2);font-size:14.5px;margin-bottom:4px}
.card{background:var(--s1);border:1px solid var(--b1);border-radius:16px;box-shadow:var(--shadow)}
.card-hd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--b1)}
.card-hd h3{font-size:14.5px;font-weight:700}
.card-bd{padding:16px 20px}
.alert{padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:10px}
.alert-ok{background:var(--green-lt);color:var(--green)}
.alert-err{background:var(--red-lt);color:var(--red)}
.av{width:34px;height:34px;border-radius:50%;background:var(--ac-lt);color:var(--ac);font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.muted{color:var(--t3)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--night);color:#fff;padding:11px 18px;border-radius:12px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow-lg);z-index:100}

/* ── Overview ── */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{padding:18px 20px}
.kpi-l{font-size:12.5px;font-weight:600;color:var(--t3)}
.kpi-v{font-size:28px;font-weight:800;letter-spacing:-.03em;margin:4px 0 2px}
.kpi-s{font-size:12.5px;color:var(--t2)}
.kpi-s b{color:var(--green)}
.ov-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:18px;margin-bottom:18px}
.chart{display:flex;align-items:flex-end;gap:6px;height:170px;padding-top:10px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bars{display:flex;align-items:flex-end;gap:3px;height:100%;width:100%;justify-content:center}
.bar{width:40%;max-width:14px;border-radius:4px 4px 0 0;min-height:2px}
.bar.s{background:#C7D2FE}.bar.p{background:var(--ac)}
.bar-x{font-size:10.5px;color:var(--t3)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--t2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.attn{display:flex;flex-direction:column}
.attn-row{display:flex;align-items:center;gap:12px;padding:13px 20px;border-top:1px solid var(--b1);border-left:none;border-right:none;border-bottom:none;background:none;text-align:left;width:100%;font-size:13.5px;color:var(--t1)}
.attn-row:first-child{border-top:none}
.attn-row:hover{background:var(--s2)}
.attn-row .n{margin-left:auto;font-size:18px;font-weight:800}
.attn-ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.attn-ic svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pay-row{display:flex;align-items:center;gap:12px;padding:11px 20px;border-top:1px solid var(--b1)}
.pay-row:first-child{border-top:none}
.pay-who{flex:1;min-width:0}
.pay-who div:first-child{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pay-amt{font-weight:700}

/* ── Inbox ── */
.ib{display:grid;grid-template-columns:380px 1fr;flex:1;min-height:0;width:100%}
.ib-list{border-right:1px solid var(--b1);display:flex;flex-direction:column;min-height:0;background:var(--s1)}
.ib-tools{padding:14px 16px;border-bottom:1px solid var(--b1);display:flex;flex-direction:column;gap:10px}
.ib-tools .row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.ib-items{flex:1;overflow-y:auto}
.ib-item{display:flex;gap:11px;padding:13px 16px;border-bottom:1px solid var(--b1);cursor:pointer;background:none;border-left:3px solid transparent;width:100%;text-align:left;font:inherit;color:inherit}
.ib-item:hover{background:var(--s2)}
.ib-item.on{background:var(--ac-lt);border-left-color:var(--ac)}
.ib-item.done{opacity:.6}
.ib-body{flex:1;min-width:0}
.ib-l1{display:flex;align-items:center;gap:8px}
.ib-from{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib-item.unread .ib-from{font-weight:800}
.ib-time{font-size:11.5px;color:var(--t3);flex-shrink:0}
.ib-subj{font-size:13px;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib-item.unread .ib-subj{font-weight:700}
.ib-snip{font-size:12.5px;color:var(--t3);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ib-dot{width:8px;height:8px;border-radius:50%;background:var(--ac);flex-shrink:0}
.ib-l3{display:flex;gap:6px;margin-top:6px}
.ib-view{overflow-y:auto;min-height:0;background:var(--bg)}
.ib-msg{max-width:820px;margin:0 auto;padding:24px 28px 40px}
.ib-back{display:none}
.ib-subject{font-size:20px;font-weight:800;letter-spacing:-.02em;margin-bottom:12px}
.ib-meta{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.ib-meta .who{flex:1;min-width:0}
.ib-meta .who b{display:block}
.ib-meta .who span{font-size:12.5px;color:var(--t3)}
.ib-actions{display:flex;gap:6px;flex-wrap:wrap}
.ib-content{background:var(--s1);border:1px solid var(--b1);border-radius:14px;padding:18px 20px;font-size:14px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
.ib-frame{width:100%;min-height:360px;border:1px solid var(--b1);border-radius:14px;background:#fff}
.ib-imgbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:8px 12px;margin-bottom:8px;border-radius:10px;background:var(--s2);font-size:12.5px;color:var(--t2)}
.ib-content a{color:var(--ac);word-break:break-all}
.ib-att{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--b1);border-radius:9px;font-size:12.5px;color:var(--t1);text-decoration:none;margin:0 6px 6px 0;background:var(--s1)}
.ib-att:hover{border-color:var(--ac)}
.ib-att span{color:var(--t3);font-size:11.5px}
.ib-att.off{opacity:.6}
.ib-note{font-size:12px;color:var(--t3);margin:8px 2px 0}
.ib-atts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.thread{margin-top:18px;display:flex;flex-direction:column;gap:10px}
.reply-sent{background:var(--ac-lt);border-radius:14px;padding:14px 16px;font-size:13.5px;white-space:pre-wrap;word-break:break-word}
.reply-sent .hd{font-size:12px;color:var(--ac);font-weight:700;margin-bottom:4px;white-space:normal}
.composer{margin-top:18px;background:var(--s1);border:1px solid var(--b1);border-radius:14px;padding:14px 16px}
.composer .row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.composer .from{font-size:12.5px;color:var(--t3)}
.ib-placeholder{height:100%;display:flex;align-items:center;justify-content:center;color:var(--t3);font-size:14px;text-align:center;padding:40px}

/* ── Users ── */
.tbl{width:100%;border-collapse:collapse}
.tbl th{padding:10px 14px;text-align:left;font-size:11.5px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--b1);background:var(--s2)}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--b1);font-size:13.5px;color:var(--t2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:#FAFAFD}
.u-who{display:flex;align-items:center;gap:11px}
.u-who b{display:block;color:var(--t1);font-weight:600}
.u-who span{font-size:12px;color:var(--t3)}
.num-edit{display:inline-flex;align-items:center;gap:6px}
.num-edit b{color:var(--t1);min-width:18px}
.pager{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-top:1px solid var(--b1);font-size:12.5px;color:var(--t3)}
.pager .pg{display:flex;gap:4px}

/* ── Settings ── */
.set-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.pe{display:flex;flex-direction:column;gap:14px}
.pe-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pe-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.pe-tools{display:flex;gap:2px;flex-wrap:wrap}
.pe-split{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pe-md{min-height:420px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13.5px}
.pe-pv{min-height:420px;max-height:640px;overflow:auto;border:1px solid var(--b1);border-radius:10px;padding:14px 16px;background:var(--s1)}
.pe-split.write .pe-pv{display:block}.pe-acts{display:flex;gap:8px;flex-wrap:wrap}
.prose{font-size:15px;line-height:1.7}.prose h2{font-size:20px;margin:18px 0 6px}.prose h3{font-size:17px;margin:14px 0 4px}.prose p{margin:0 0 12px}
.prose img{max-width:100%;border-radius:8px}.prose blockquote{margin:12px 0;padding-left:12px;border-left:3px solid var(--ac);color:var(--t2)}.prose ul,.prose ol{padding-left:20px;margin:0 0 12px}
@media (max-width:760px){ .pe-row{grid-template-columns:1fr} .pe-split{grid-template-columns:1fr} .pe-split.write .pe-pv{display:none} .pe-split.preview .pe-md{display:none} .pe-acts .btn{flex:1} }
.rv-row{padding:16px 20px;border-top:1px solid var(--b1);display:flex;flex-direction:column;gap:10px}
.rv-top{display:flex;align-items:flex-start;gap:12px}
.rv-who{flex:1;min-width:0;font-size:13.5px}
.rv-c{margin-top:4px;font-size:13.5px;line-height:1.55;color:var(--t1);white-space:pre-wrap;overflow-wrap:anywhere}
.rv-body{padding-left:48px}
.rv-cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-left:48px}
.rv-cmp > div{background:var(--s2);border-radius:10px;padding:10px 12px}
.rv-l{font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--t3);margin-bottom:4px}
.rv-acts{display:flex;gap:8px;flex-wrap:wrap;padding-left:48px}
.rv-set{display:flex;align-items:center;gap:16px;flex-wrap:wrap}.rv-set>div:first-child{flex:1;min-width:220px}.rv-set-c{display:flex;gap:8px}.rv-set-c .inp{width:auto}
@media (max-width:760px){ .rv-body,.rv-cmp,.rv-acts{padding-left:0} .rv-cmp{grid-template-columns:1fr} .rv-acts .btn{flex:1} .rv-set-c{width:100%} .rv-set-c .inp{flex:1} }
body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
.st-banner{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:12px;margin-bottom:16px;font-weight:700}
.st-banner.ok{background:var(--green-lt);color:var(--green)}.st-banner.warn{background:var(--amber-lt);color:var(--amber)}.st-banner.down{background:var(--red-lt);color:var(--red)}
.st-banner span{font-weight:500;font-size:12.5px;color:var(--t2);margin-left:auto}
.st-group{font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--t3);margin:16px 0 4px}
.st-group:first-child{margin-top:0}
.chk-ic.down{background:var(--red-lt);color:var(--red)}
.ppl{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ppl span{display:inline-flex;align-items:center;gap:6px;background:var(--ac-lt);color:var(--ac);border-radius:99px;padding:4px 6px 4px 10px;font-size:12.5px;font-weight:600}
.ppl button{border:0;background:none;color:var(--ac);font-weight:700;cursor:pointer;padding:0 4px}
.chk{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-top:1px solid var(--b1)}
.chk:first-child{border-top:none;padding-top:0}
.chk-ic{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.chk-ic.ok{background:var(--green-lt);color:var(--green)}.chk-ic.no{background:var(--amber-lt);color:var(--amber)}
.chk-ic svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.chk-t{display:block;font-size:13.5px;font-weight:700}
.chk span{font-size:12.5px;color:var(--t2)}
.chk code{font-size:12px;background:var(--s2);padding:1px 6px;border-radius:5px;overflow-wrap:anywhere}
.toggle{position:relative;width:44px;height:24px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0;position:absolute}
.toggle-track{position:absolute;inset:0;background:var(--b2);border-radius:12px;cursor:pointer;transition:background .2s}
.toggle input:checked + .toggle-track{background:var(--red)}
.toggle-track::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.toggle input:checked + .toggle-track::after{transform:translateX(20px)}
.maint{display:flex;align-items:center;justify-content:space-between;gap:16px}

/* ── Newsletter builder (restyled) ── */
.email-layout{display:grid;grid-template-columns:400px 1fr;gap:18px;height:calc(100vh - 64px - 64px)}
.email-left{display:flex;flex-direction:column;gap:12px;overflow-y:auto;padding-right:4px}
.email-right{display:flex;flex-direction:column;min-height:0}
.email-right .card{flex:1;display:flex;flex-direction:column;min-height:0}
.preview-iframe{width:100%;flex:1;border:none;background:#f0f2f5;border-radius:0 0 16px 16px}
.preview-iframe.phone{width:390px;max-width:100%;margin:12px auto;display:block;border:1px solid var(--b1);border-radius:24px;min-height:720px}
.pv-stage{display:flex;flex-direction:column;background:#f0f2f5;border-radius:0 0 16px 16px}
.pv-head{padding:10px 18px;border-bottom:1px solid var(--b1);font-size:12.5px;color:var(--t2);display:flex;flex-direction:column;gap:2px}
.pv-head b{display:inline-block;width:64px;color:var(--t3);font-weight:600}
.seg-sm{display:inline-flex;border:1px solid var(--b1);border-radius:8px;overflow:hidden;margin-right:6px}
.seg-sm button{border:none;background:none;padding:5px 10px;font-size:12px;font-weight:600;color:var(--t2);cursor:pointer}
.seg-sm button.on{background:var(--ac-lt);color:var(--ac)}
.email-toolbar{display:flex;flex-wrap:wrap;gap:6px;padding:12px;background:var(--s1);border:1px solid var(--b1);border-radius:14px}
.tb-label{width:100%;font-size:11px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.06em}
.tb-btn{height:28px;padding:0 10px;border-radius:8px;border:1px solid var(--b1);background:var(--s1);color:var(--t2);font-size:12px;font-weight:600}
.tb-btn:hover{border-color:var(--ac);color:var(--ac)}
.tb-sep{width:100%;height:1px;background:var(--b1);margin:4px 0}
.blocks-container{display:flex;flex-direction:column;gap:8px}
.block-wrap{border:1px solid var(--b1);border-radius:12px;background:var(--s1);overflow:hidden}
.block-wrap.drag-over{border-color:var(--ac);box-shadow:0 0 0 3px var(--ac-ring)}
.block-wrap.dragging{opacity:.4}
.block-header{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--s2);border-bottom:1px solid var(--b1);user-select:none;cursor:grab}
.block-grip{color:var(--t3)}
.block-type-label{flex:1;font-size:11.5px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.05em}
.block-actions{display:flex;gap:3px}
.bc-btn{width:24px;height:24px;border-radius:6px;border:1px solid var(--b1);background:var(--s1);color:var(--t2);font-size:11px}
.bc-btn:hover{color:var(--t1);border-color:var(--b2)}
.bc-btn.del:hover{color:var(--red);border-color:#F5C2C2;background:var(--red-lt)}
.bc-btn:disabled{opacity:.3}
.block-body{padding:10px 12px;display:flex;flex-direction:column;gap:7px}
.bi{width:100%;background:var(--s1);border:1px solid var(--b1);border-radius:8px;padding:7px 9px;color:var(--t1);font-size:12.5px;font-family:inherit;outline:none}
.bi:focus{border-color:var(--ac)}
textarea.bi{resize:vertical;min-height:60px;line-height:1.55}
.bi-row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.bi-label{font-size:11.5px;color:var(--t3);white-space:nowrap}
input[type=color].bi-color{width:32px;height:28px;padding:1px;border-radius:6px;border:1px solid var(--b1);background:var(--s1)}
input[type=range]{flex:1;accent-color:var(--ac)}
.send-panel{background:var(--s1);border:1px solid var(--b1);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.send-panel .row{display:flex;gap:8px}


/* Builder markup aliases */
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--b1)}
.card-head h3{font-size:14px;font-weight:700}
.card-body{padding:14px 18px}
.email-right .card-body{flex:1;display:flex;padding:0;min-height:0}
.form-group{display:flex;flex-direction:column;gap:6px}
.form-label{font-size:12.5px;font-weight:600;color:var(--t2)}
.btn-default{}
.alert-success{background:var(--green-lt);color:var(--green)}
.tpl-sel{width:100%;margin:2px 0 8px}
.tpl-acts{display:flex;flex-wrap:wrap;gap:6px}
.dlg-back{position:fixed;inset:0;z-index:9999;background:rgba(15,15,30,.45);display:flex;align-items:center;justify-content:center;padding:16px;animation:dlgIn .12s ease}
.dlg{width:100%;max-width:420px;background:var(--s1);border:1px solid var(--b1);border-radius:16px;padding:22px 22px 18px;box-shadow:0 24px 64px rgba(15,15,30,.28)}
.dlg-t{font-size:17px;font-weight:700;color:var(--t1);margin-bottom:6px}
.dlg-m{font-size:14px;line-height:1.55;color:var(--t2)}
.dlg-in{width:100%;margin-top:12px}
.dlg-f{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.btn-danger-solid{background:var(--red);border-color:var(--red);color:#fff}
.btn-danger-solid:hover{filter:brightness(.95)}
@keyframes dlgIn{from{opacity:0}to{opacity:1}}
.notice-box{margin-top:8px;padding:10px 12px;border-radius:9px;background:var(--amber-lt);color:var(--t1);font-size:12.5px;line-height:1.55}
.notice-check{display:flex;gap:8px;align-items:flex-start;margin-top:8px;font-weight:600;cursor:pointer}
.notice-check input{margin-top:3px}
.alert-error{background:var(--red-lt);color:var(--red)}
.flex{display:flex;align-items:center;gap:8px}

/* ── Login ── */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(700px 400px at 50% 0%,#E4E7FF,transparent 70%),var(--bg)}
.login-card{width:100%;max-width:380px;background:var(--s1);border:1px solid var(--b1);border-radius:20px;padding:32px;box-shadow:var(--shadow-lg)}
.login-brand{display:flex;justify-content:center;margin-bottom:10px}.login-brand svg{display:block;width:auto}
.logo-anim .logo-stroke{stroke-dasharray:1 2;stroke-dashoffset:1;animation:logo-draw 1.15s cubic-bezier(.6,0,.25,1) .15s forwards}.logo-anim .logo-word{opacity:0;animation:logo-in .7s cubic-bezier(.2,.7,.2,1) .9s forwards}.logo-anim .logo-word2{animation-delay:1.02s}@keyframes logo-draw{to{stroke-dashoffset:0}}@keyframes logo-in{from{opacity:0;transform:translateX(-8px);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}@media (prefers-reduced-motion:reduce){.logo-anim .logo-stroke{stroke-dasharray:none;animation:none}.logo-anim .logo-word{opacity:1;animation:none}}
.login-sub{text-align:center;color:var(--t3);font-size:13px;margin-bottom:22px}
.login form{display:flex;flex-direction:column;gap:12px}

@media (max-width:1100px){ .kpis{grid-template-columns:1fr 1fr} .ov-grid,.set-grid{grid-template-columns:1fr} }
@media (max-width:900px){
  .email-layout{grid-template-columns:minmax(0,1fr);height:auto}
  .email-left{overflow:visible;padding-right:0}
  .email-right{height:520px}
  .ib{grid-template-columns:1fr}
  .ib.has-sel .ib-list{display:none}
  .ib:not(.has-sel) .ib-view{display:none}
  .ib-back{display:inline-flex;margin-bottom:12px}
}
/* Phones: a bottom tab bar (Overview, Inbox, Users, Email, More) instead of the sidebar */
.tabbar,.more-sheet,.more-bg{display:none}
@media (max-width:760px){
  .sb{display:none!important}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--night);padding:6px 4px calc(6px + env(safe-area-inset-bottom));border-top:1px solid rgba(255,255,255,.08)}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:none;background:none;color:#9A9AB8;font:600 11px var(--f);padding:6px 0;position:relative;cursor:pointer}
  .tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .tab.on{color:#fff}
  .tab .dot{position:absolute;top:2px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 4px;border-radius:99px;background:var(--ac);color:#fff;font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .more-bg{display:block;position:fixed;inset:0;z-index:70;background:rgba(20,20,43,.45)}
  .more-sheet{display:block;position:fixed;left:0;right:0;bottom:0;z-index:71;background:var(--s1);border-radius:18px 18px 0 0;padding:10px 12px calc(14px + env(safe-area-inset-bottom));box-shadow:var(--shadow-lg)}
  .more-grab{width:38px;height:5px;border-radius:99px;background:var(--b2);margin:2px auto 10px}
  .more-row{display:flex;align-items:center;gap:12px;width:100%;padding:13px 10px;border:none;background:none;border-radius:10px;font:600 15px var(--f);color:var(--t1);text-decoration:none;cursor:pointer}
  .more-row:active,.more-row.on{background:var(--ac-lt);color:var(--ac)}
  .more-row svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .more-row .count{margin-left:auto;background:var(--ac);color:#fff;border-radius:99px;font-size:11.5px;padding:2px 8px}
  .more-who{font-size:12.5px;color:var(--t3);padding:8px 10px 4px;border-top:1px solid var(--b1);margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .main{padding-bottom:calc(70px + env(safe-area-inset-bottom))}
  .top-r .btn span.hide-sm{display:none}
  /* Tables become cards: one per row, each value with its label */
  .tbl.cards{display:block;overflow:visible}
  .tbl.cards thead{display:none}
  .tbl.cards tbody{display:block}
  .tbl.cards tr{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;padding:14px 16px;border-top:1px solid var(--b1)}
  .tbl.cards td{display:block;padding:0!important;border:0!important;min-width:0;text-align:left!important;white-space:normal!important}
  .tbl.cards td[data-label]::before{content:attr(data-label);display:block;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--t3);margin-bottom:3px}
  .tbl.cards td.full{grid-column:1/-1}
  .tbl.cards td.acts{display:flex;gap:8px;flex-wrap:wrap}
  .tbl.cards td.acts .btn{flex:1}
  .tbl.cards .u-who span{overflow-wrap:anywhere}
  /* Users: a list row. Name and email; how they sign in and when they joined; one line of numbers; small actions */
  .tbl.cards.users-tbl tr{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:14px 16px 14px 62px}
  .tbl.cards.users-tbl td.full:first-child{flex:1 1 100%;margin-left:-46px}
  .tbl.cards.users-tbl td[data-label]::before{display:inline;font-size:12.5px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--t3);margin:0 5px 0 0}
  .tbl.cards.users-tbl td[data-label="Sign-in"]::before{display:none}
  .tbl.cards.users-tbl td[data-label="Sign-in"]{flex:0 0 auto}
  .tbl.cards.users-tbl td[data-label="Joined"]{flex:0 1 auto;font-size:13px;color:var(--t2)}
  /* the numbers start on their own line, the buttons after them */
  .tbl.cards.users-tbl tr::after{content:"";flex-basis:100%;height:0;order:1}
  .tbl.cards.users-tbl td[data-label="CVs"],.tbl.cards.users-tbl td[data-label="Paid"],.tbl.cards.users-tbl td[data-label="Invited"],.tbl.cards.users-tbl td[data-label="Free CVs"],.tbl.cards.users-tbl td[data-label="AI credits"]{order:2}
  .tbl.cards.users-tbl td.acts{order:3}
  .tbl.cards.users-tbl td[data-label="CVs"],.tbl.cards.users-tbl td[data-label="Paid"],.tbl.cards.users-tbl td[data-label="Invited"],.tbl.cards.users-tbl td[data-label="Free CVs"],.tbl.cards.users-tbl td[data-label="AI credits"]{flex:0 0 auto;font-size:14px;font-weight:700;color:var(--t1);display:inline-flex;align-items:baseline}
  .tbl.cards.users-tbl .num-edit{display:inline-flex;align-items:baseline;gap:2px}
  .tbl.cards.users-tbl .num-edit .btn{height:auto;padding:0 2px 0 4px;font-size:12.5px;font-weight:600;color:var(--ac);background:none;border:0}
  .tbl.cards.users-tbl td.acts{flex:1 1 100%;justify-content:flex-start;gap:8px;margin-top:4px}
  .tbl.cards.users-tbl td.acts .btn{flex:0 0 auto;height:32px;padding:0 14px}
  /* Lists: filters and search take the full width */
  .card-hd > div > .inp,.card-hd > div > select{flex:1 1 100%!important;width:100%!important}
  .card-hd > div > .btn{flex:1}
  /* Payments: name and email on one line each, the product and amount underneath */
  .pay-row{flex-wrap:wrap;row-gap:6px;padding:12px 16px}
  .pay-who{flex:1 1 calc(100% - 56px)}
  .pay-who .muted{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pay-row > .badge{margin-left:52px}
  .pay-row > .pay-amt{margin-left:auto}
  /* Page header: the website link is under More; Refresh keeps only its icon */
  .top-r a.btn{display:none}
  .top{flex-wrap:nowrap}
  .top p{font-size:12px}
  /* Email preview: a phone shows the phone width; the controls wrap inside the card */
  .email-right .card-head{flex-wrap:wrap;gap:8px}
  .email-right .card-head .flex{flex-wrap:wrap;gap:6px}
  .email-right .seg-sm:first-child{display:none}
  .email-right .preview-iframe{width:100%!important;max-width:100%}
  /* Inbox: the list fits the screen (filters wrap instead of pushing it wider) */
  .ib{grid-template-columns:minmax(0,1fr)!important}
  .ib-tools .row{flex-wrap:wrap}
  .ib-tools .seg{flex-wrap:wrap;max-width:100%}
}
@media (max-width:760px){
  .app{flex-direction:column;height:auto;min-height:100vh}
  .sb{width:100%;flex-direction:row;flex-wrap:wrap;align-items:center}
  .sb-head{padding:12px 14px}
  .sb-nav{flex:0 0 100%;flex-direction:row;overflow-x:auto;padding:0 8px 10px;order:3;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}
  .sb-nav::-webkit-scrollbar{display:none}
  .nav{width:auto;white-space:nowrap}
  .sb-foot{border:none;margin-left:auto;padding:8px 12px}
  .sb-mail{display:none}
  .top{padding:0 16px;height:auto;min-height:58px;flex-wrap:wrap;padding-top:10px;padding-bottom:10px}
  .content{padding:16px}
  .content.flush{height:calc(100vh - 170px)}
  .kpis{grid-template-columns:1fr 1fr;gap:10px}
  .kpi-v{font-size:22px}
  .tbl{display:block;overflow-x:auto}
  .kpis[style]{grid-template-columns:1fr 1fr!important}
  .kpis[style] > :last-child:nth-child(odd){grid-column:1 / -1}
  .card-hd{flex-wrap:wrap}
  .card-hd > form,.card-hd > div{flex:1 1 100%;flex-wrap:wrap}
  .card-hd .inp[style]{width:auto!important;flex:1 1 140px;min-width:0}
  .card-head{flex-wrap:wrap}
  .ib-msg{padding:16px}
}
/* ── Premium pass: the homepage's look (soft tiles, capsules, calm labels, large titles) ── */
html,body{letter-spacing:-.006em}
/* Sidebar: deep night with a soft glow, rounder items */
.sb{background:radial-gradient(420px 260px at 0% 0%,rgba(99,91,255,.16),transparent 70%),linear-gradient(180deg,#16163A,#101026);width:244px}
.sb-head{padding:24px 20px 22px}
.sb-tag{font-size:11.5px;font-weight:600;letter-spacing:0;text-transform:none;color:#C9CCFF;background:rgba(255,255,255,.08);padding:3px 10px}
.sb-nav{padding:4px 12px;gap:3px}
.nav{padding:10px 12px;border-radius:12px;font-weight:500;color:#B9B9D6;transition:background .2s var(--ease),color .2s var(--ease)}
.nav:hover{background:rgba(255,255,255,.05)}
.nav.on{background:rgba(255,255,255,.09);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.nav .count{background:linear-gradient(180deg,#6A63F0,#4338CA)}
.sb-foot{margin:10px 12px 14px;padding:10px 12px;border:none;border-radius:16px;background:rgba(255,255,255,.05)}
.sb-av{background:radial-gradient(circle at 30% 25%,#8B85FF,#4338CA 55%,#2A2390)}
/* Large page titles on the page itself, no bar */
.top{height:auto;min-height:96px;padding:30px 40px 10px;background:none;border-bottom:none;align-items:flex-end}
.top h1{font-size:34px;font-weight:800;letter-spacing:-.04em;line-height:1.1}
.top p{font-size:14px;color:var(--t3);margin-top:4px}
.content{padding:22px 40px 56px}
.content.flush{padding:0}
.content.enter > *{animation:pgIn .32s var(--ease) both}
@keyframes pgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.content.enter > *{animation:none}}
/* Capsule buttons */
.btn{height:38px;padding:0 16px;border-radius:999px;border:1px solid transparent;background:var(--fill);font-weight:600;transition:background .2s var(--ease),color .2s var(--ease),box-shadow .2s var(--ease),transform .2s var(--ease)}
.btn:hover:not(:disabled){background:var(--fill2);border-color:transparent}
.btn:active:not(:disabled){transform:scale(.98)}
.btn-primary{background:var(--ac);color:#fff;box-shadow:0 1px 2px rgba(67,56,202,.22)}
.btn-primary:hover:not(:disabled){background:var(--ac2)}
.btn-danger{color:var(--red)}
.btn-danger:hover:not(:disabled){background:var(--red-lt)}
.btn-ghost{background:none}
.btn-ghost:hover:not(:disabled){background:var(--fill)}
.btn-sm{height:32px;padding:0 13px;border-radius:999px}
.btn-danger-solid{background:var(--red);color:#fff}
.btn-danger-solid:hover:not(:disabled){background:#C81E1E}
/* Fields: soft fill, a ring on focus */
.inp,.bi{border-color:transparent;background:var(--s2);border-radius:12px;transition:background .2s var(--ease),box-shadow .2s var(--ease),border-color .2s var(--ease)}
.inp{height:42px;padding:0 14px}
textarea.inp{padding:12px 14px}
.inp:hover,.bi:hover{background:#EDEDF4}
.inp:focus,.bi:focus{background:var(--s1);border-color:var(--ac);box-shadow:0 0 0 4px var(--ac-ring)}
.lbl,.form-label{font-size:13px;color:var(--t2)}
.seg{border:none;background:var(--fill);border-radius:999px}
.seg button{border-radius:999px;font-weight:500;transition:background .2s var(--ease),color .2s var(--ease)}
.seg button.on{font-weight:600;box-shadow:var(--shadow)}
.seg-sm{border:none;background:var(--fill);border-radius:999px;padding:2px}
.seg-sm button{border-radius:999px}
.seg-sm button.on{background:var(--s1);color:var(--t1);box-shadow:var(--shadow)}
/* Tiles instead of boxes */
.card{border:none;border-radius:24px;box-shadow:var(--shadow-md)}
.card-hd,.card-head{padding:20px 24px;border-bottom:1px solid var(--b1)}
.card-hd h3,.card-head h3{font-size:17px;font-weight:750;letter-spacing:-.025em}
.card-bd{padding:20px 24px}
.card-body{padding:18px 24px}
.alert{border-radius:14px}
/* Overview numbers */
.kpis{gap:16px;margin-bottom:20px}
.kpi{padding:22px 24px 20px}
.kpi-l{font-size:13px;font-weight:500;color:var(--t3)}
.kpi-v{font-size:36px;letter-spacing:-.045em;line-height:1.05;margin:8px 0 6px}
.kpi-s{font-size:13px}
.ov-grid{gap:20px;margin-bottom:20px}
.bar{border-radius:6px 6px 2px 2px}
.bar.p{background:linear-gradient(180deg,#6A63F0,#4338CA)}
.attn-row{padding:15px 24px;transition:background .2s var(--ease)}
.attn-row:hover{background:var(--s2)}
.attn-ic{border-radius:12px}
.pay-row{padding:13px 24px}
.av{background:linear-gradient(140deg,#EEF0FF,#E0E3FF)}
/* Tables: calm headers and hairlines */
.tbl th{font-size:12.5px;font-weight:600;color:var(--t3);text-transform:none;letter-spacing:0;background:none;padding:14px 16px 10px}
.tbl td{padding:14px 16px}
.tbl tr:hover td{background:#FAFAFC}
.pager{padding:14px 24px}
/* Calm labels: no uppercase tracking */
.rv-l,.st-group,.tb-label,.block-type-label{text-transform:none;letter-spacing:-.005em;font-size:12.5px;font-weight:600}
.st-group{font-size:13px;color:var(--t2);margin:20px 0 6px}
.badge{font-weight:600;letter-spacing:.005em}
/* Settings and reviews */
.st-banner{border-radius:18px;padding:16px 20px}
.chk{padding:14px 0}
.rv-row{padding:18px 24px}
.rv-cmp > div{border-radius:14px;padding:12px 14px}
/* Switches: green when on (maintenance stays red) */
.toggle{width:46px;height:28px}
.toggle-track{border-radius:99px;background:#DCDCE6;transition:background .25s var(--ease)}
.toggle input:checked + .toggle-track{background:var(--green)}
#maint-toggle:checked + .toggle-track{background:var(--red)}
.toggle-track::after{top:2px;left:2px;width:24px;height:24px;box-shadow:0 2px 4px rgba(0,0,0,.18),0 0 0 .5px rgba(0,0,0,.04);transition:transform .25s var(--ease)}
.toggle input:checked + .toggle-track::after{transform:translateX(18px)}
/* Inbox */
.ib-tools{padding:16px 18px}
.ib-item{padding:14px 18px;border:none;border-bottom:1px solid var(--b1);transition:background .15s var(--ease)}
.ib-item.on{background:var(--ac-lt);box-shadow:inset 3px 0 0 var(--ac)}
.ib-msg{padding:30px 36px 48px}
.ib-subject{font-size:26px;letter-spacing:-.035em;line-height:1.2;margin-bottom:16px}
.ib-content,.composer{border:none;border-radius:20px;box-shadow:var(--shadow-md);padding:20px 24px}
.ib-frame{border:none;border-radius:20px;box-shadow:var(--shadow-md)}
.reply-sent{border-radius:20px;padding:16px 20px}
.ib-att{border:none;background:var(--s1);box-shadow:var(--shadow);border-radius:999px;padding:7px 14px}
.ib-imgbar{border-radius:14px}
/* Email builder */
.email-toolbar,.send-panel{border:none;border-radius:20px;box-shadow:var(--shadow-md);padding:16px}
.tb-btn{border:none;background:var(--fill);border-radius:999px;padding:0 12px}
.tb-btn:hover{background:var(--ac-lt);color:var(--ac)}
.block-wrap{border:none;border-radius:16px;box-shadow:var(--shadow-md)}
.block-header{background:var(--s1);border-bottom:1px solid var(--b1)}
.bc-btn{border:none;background:var(--fill);border-radius:8px}
.pv-stage,.preview-iframe{background:#F2F2F7;border-radius:0 0 24px 24px}
.pe-pv{border:none;border-radius:16px;background:var(--s2)}
/* Dialogs and toast */
.dlg-back{background:rgba(15,15,30,.32);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:dlgIn .2s var(--ease)}
.dlg{border:none;border-radius:24px;padding:26px 26px 20px;box-shadow:0 30px 80px rgba(15,15,30,.28);animation:dlgPop .25s var(--ease)}
@keyframes dlgPop{from{opacity:0;transform:scale(.97) translateY(6px)}to{opacity:1;transform:none}}
.dlg-t{font-size:19px;font-weight:750;letter-spacing:-.025em}
.toast{border-radius:999px;padding:12px 20px;background:rgba(20,20,43,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.notice-box{border-radius:14px}
/* Sign-in */
.login{background:radial-gradient(800px 480px at 50% -10%,#E2E4FF,transparent 70%),var(--bg)}
.login-card{max-width:400px;border:none;border-radius:28px;padding:40px 36px 34px;box-shadow:var(--shadow-lg)}
.login-sub{font-size:14px;margin-bottom:26px}
.login form{gap:14px}
.login .btn-primary{height:46px!important;font-size:15px;margin-top:4px}
@media (max-width:1100px){ .top{padding:26px 28px 8px} .content{padding:20px 28px 48px} .content.flush{padding:0} }
@media (max-width:760px){
  .top{min-height:0;padding:18px 18px 4px;align-items:flex-end}
  .top h1{font-size:28px}
  .top p{font-size:13px}
  .content{padding:14px 16px 24px}
  .content.flush{padding:0}
  .kpi{padding:16px 18px}
  .kpi-v{font-size:26px}
  .card{border-radius:20px}
  .card-hd,.card-head{padding:16px 18px}
  .card-bd{padding:16px 18px}
  .tabbar{background:rgba(16,16,38,.86);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:1px solid rgba(255,255,255,.06)}
  .tab{font-weight:500}
  .more-bg{backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
  .more-sheet{border-radius:26px 26px 0 0;padding:10px 14px calc(16px + env(safe-area-inset-bottom))}
  .more-row{border-radius:14px;font-weight:500}
  .tbl.cards td[data-label]::before{text-transform:none;letter-spacing:0;font-size:12px;font-weight:600}
  .ib-msg{padding:16px}
  .ib-subject{font-size:22px}
  .login-card{padding:32px 24px 28px}
}

const emailCsp = (remote) => `<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data: cid:${remote ? ' https: http:' : ''}; style-src 'unsafe-inline'${remote ? ' https:' : ''}; font-src data:${remote ? ' https:' : ''}"><base target="_blank">`
// The received email in its sandboxed frame: inline (cid:) images swapped for the files we
// downloaded, remote images only when "Show images" is on (they can tell the sender you opened it)
function setEmailFrame() {
  const d = S.inbox.detail, f = $('ib-frame')
  if (!f || !d?.html_body) return
  let html = d.html_body
  for (const [cid, url] of Object.entries(S.inbox.cidData || {})) html = html.split('cid:' + cid).join(url)
  f.srcdoc = emailCsp(!!S.inbox.showImages) + html
  f.onload = () => { try { f.style.height = Math.min(2400, Math.max(360, f.contentDocument?.body?.scrollHeight + 40 || 360)) + 'px' } catch {} }
}
// Inline images (logos, screenshots pasted into the email) are attachments; load them as data: URLs
async function loadInlineImages(d) {
  S.inbox.cidData = {}
  const imgs = (d.attachments || []).filter(a => a.id && a.cid && /^image\//.test(a.type || ''))
  for (const a of imgs) {
    try {
      const r = await fetch(`/api/admin/inbox/${d.id}/attachments/${a.id}?inline=1`, { credentials: 'include' })
      if (!r.ok) continue
      const blob = await r.blob()
      S.inbox.cidData[a.cid] = await new Promise(res => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.readAsDataURL(blob) })
    } catch {}
  }
  if (S.inbox.detail === d && imgs.length) setEmailFrame()
}

function ago(s) {
  if (!s) return ''
  const d = (Date.now() - new Date(s)) / 1000
  if (d < 60) return 'now'

// ── API ───────────────────────────────────────────────────────────────────────
async function api(method, path, body) {
  const r = await fetch('/api/admin' + path, { method, credentials: 'include', headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined })
  const d = await r.json().catch(() => ({ error: `HTTP ${r.status}` }))
  if (!r.ok) { if (r.status === 401 && S.auth) { S.auth = null; render() } throw new Error(d.error || 'Request failed') }
  return d
}

// ── Auth ──────────────────────────────────────────────────────────────────────
async function checkAuth() {
  try { S.auth = await api('GET', '/me'); await go(location.hash.slice(1) || 'overview') }
  catch { S.auth = null; render() }
}
async function login() {
  S.login.loading = true; S.login.err = ''; render()
  try { await api('POST', '/login', { email: S.login.email, password: S.login.password, remember: S.login.remember }); S.auth = await api('GET', '/me'); await go('overview') }
  catch (e) { S.login.err = e.message; S.login.loading = false; render() }
}
async function logout() { S.moreOpen = false; await api('POST', '/logout').catch(() => {}); S.auth = null; render() }

// ── Navigation ────────────────────────────────────────────────────────────────
const PAGES = {
  overview:   ['Overview', 'How CVMaster is doing'],
  inbox:      ['Inbox', 'Emails to support@cvmaster.live and messages from the site'],
  users:      ['Users', 'Accounts, credits and referrals'],
  reviews:    ['Reviews', 'Ratings from people who made a CV. Approve comments for the homepage'],
  newsletter: ['Email', 'Newsletters to subscribers, and important notices to every user'],
  subscribers:['Subscribers', 'People who agreed to get the newsletter'],
  blog:       ['Blog', 'Articles, product updates, news and links shared from elsewhere'],
  app:        ['App & activity', 'Who is active, phones with notifications, and push messages to the app'],
  settings:   ['Settings', 'Maintenance mode and setup status'],
}
async function go(p) {
  if (!PAGES[p]) p = 'overview'
  S.page = p
  if (location.hash.slice(1) !== p) history.replaceState(null, '', '#' + p)
  render()
  if (p === 'overview') await loadStats()
  if (p === 'inbox') await loadInbox()
  if (p === 'users' && !S.users.length) await loadUsers(1)
  if (p === 'reviews') await loadReviews()
  if (p === 'subscribers' || p === 'newsletter') await loadSubs()
  if (p === 'newsletter') { loadHistory(); loadMyTemplates() }
  if (p === 'settings') await Promise.all([loadStatus(), S.stats ? null : loadStats()])
  if (p === 'overview' && !S.status) loadStatus()
  if (p === 'app') await loadActivity()
  if (p === 'blog' && !S.blog.edit) await loadPosts()
  if (p === 'overview' || !S.stats) loadCounts()
}
// Unread emails + open site messages for the nav badge
async function loadCounts() {
  try { const d = await api('GET', '/stats'); S.stats = d; S.maintenance = !!d.maintenance; render() } catch {}
  try { S.rv = await api('GET', '/reviews'); render() } catch {}
}

// ── Overview ──────────────────────────────────────────────────────────────────
async function loadStats() {
  S.statsLoading = !S.stats; render()
  try { const d = await api('GET', '/stats'); S.stats = d; S.maintenance = !!d.maintenance } catch (e) { toast(e.message) }
  S.statsLoading = false; render()
}
async function toggleMaintenance() {
  const on = !S.maintenance
  if (on && !(await ask({ title: 'Turn on maintenance mode?', message: 'Everyone visiting the site will see a “back soon” page until you turn it off.', ok: 'Turn on', danger: true }))) { render(); return }
  S.maintLoading = true; render()
  try { const d = await api('POST', '/maintenance', { enabled: on }); S.maintenance = !!d.maintenance; toast(S.maintenance ? 'Maintenance mode is ON' : 'Site is live again') } catch (e) { toast(e.message) }
  S.maintLoading = false; render()
}

async function loadPosts() {

  S.blog.edit = p ? { ...newPost(), ...p, notify: true } : newPost()

}
const postPayload = (e, status) => ({ title: e.title, slug: e.slug, category: e.category, lang: e.lang, cover: e.cover, excerpt: e.excerpt, body: e.body,
  sourceName: e.sourceName, sourceUrl: e.sourceUrl, author: e.author, groupId: e.groupId, status, notify: !!e.notify })
async function savePost(status) {
  const e = S.blog.edit
  if (!e.title.trim()) { toast('Give the post a title.'); return }
  if (status === 'published' && !e.id) { await savePost('draft'); if (!S.blog.edit?.id) return; return savePost('published') }
  if (status === 'published' && e.status !== 'published') {
    if (!(await ask({ title: 'Publish this post?', message: `It goes live at www.cvmaster.live/blog${e.notify ? ', and every phone with the app gets a notification' : ''}.`, ok: 'Publish' }))) return
  }
  S.blog.saving = true; render()
  try {
    const r = e.id ? await api('PUT', '/posts/' + e.id, postPayload(e, status || e.status)) : await api('POST', '/posts', postPayload(e, 'draft'))
    S.blog.edit = { ...S.blog.edit, ...r }
    toast(status === 'published' && e.status !== 'published' ? `Published${r.pushed?.devices ? ` · sent to ${r.pushed.sent} phone${r.pushed.sent === 1 ? '' : 's'}` : ''}` : status === 'draft' && e.status === 'published' ? 'Unpublished (now a draft)' : 'Saved')
    loadPosts()
  } catch (err) { toast(err.message) }
  S.blog.saving = false; render()
}
async function deletePost() {
  const e = S.blog.edit
  if (!(await ask({ title: 'Delete this post?', message: `“${e.title}” will be removed${e.status === 'published' ? ' from the site' : ''}. This can’t be undone.`, ok: 'Delete', danger: true }))) return
  try { await api('DELETE', '/posts/' + e.id); S.blog.edit = null; toast('Deleted'); loadPosts() } catch (err) { toast(err.message) }
}
async function translatePost(lang) {
  const e = S.blog.edit
  if (!e.id) { toast('Save the post first.'); return }
  S.blog.saving = true; render()
  try { const r = await api('POST', `/posts/${e.id}/translate`, { lang }); await loadPosts(); S.blog.edit = { ...newPost(), ...r, notify: false }; toast(`Draft in ${BLOG_LANGS[lang]}. Check it, then publish`) }
  catch (err) { toast(err.message) }
  S.blog.saving = false; render(); refreshPostPreview()
}
async function uploadPostImage(file, where) {
  const fd = new FormData(); fd.append('image', file)
  try {
    const r = await fetch('/api/admin/posts/images', { method: 'POST', credentials: 'include', body: fd })
    const j = await r.json().catch(() => ({}))
    if (!r.ok) throw new Error(j.error || 'Upload failed')
    if (where === 'cover') S.blog.edit.cover = j.url
    else insertMd(`\n![${file.name.replace(/\.[^.]+$/, '').replace(/[[\]]/g, '')}](${j.url})\n`)
    render(); refreshPostPreview()
  } catch (err) { toast(err.message) }
}
function insertMd(before, after = '', placeholder = '') {
  const ta = $('pb-body'); const e = S.blog.edit
  const a = ta ? ta.selectionStart : e.body.length, b = ta ? ta.selectionEnd : e.body.length
  const sel = e.body.slice(a, b) || placeholder
  e.body = e.body.slice(0, a) + before + sel + after + e.body.slice(b)
  render(); refreshPostPreview()
  const t2 = $('pb-body'); if (t2) { t2.focus(); t2.selectionStart = a + before.length; t2.selectionEnd = a + before.length + sel.length }
}

function inboxItems() {
  const I = S.inbox
  const list = I.tab === 'email' ? I.emails : I.tab === 'site' ? I.site : [...I.emails, ...I.site]
  return list.slice().sort((a, b) => new Date(b._t) - new Date(a._t))
}
async function openItem(kind, id) {
  const I = S.inbox
  I.sel = { kind, id }; I.reply = ''; I.err = ''; I.detail = null; I.detailLoading = true; render()
  try {
    if (kind === 'email') {
      I.detail = { ...(await api('GET', '/inbox/' + id)), _k: 'email' }
      const row = I.emails.find(m => m.id === id); if (row && !row.read) { row.read = true; I.unread = Math.max(0, I.unread - 1) }
    } else {
      const m = I.site.find(x => x.id === id)
      const r = await api('GET', `/feedback/${id}/replies`)
      I.detail = { ...m, replies: r.replies, _k: 'site' }
    }
  } catch (e) { I.err = e.message }
  I.showImages = false; I.cidData = {}
  I.detailLoading = false; render()
  setEmailFrame()
  if (I.detail?._k === 'email') loadInlineImages(I.detail)
}
async function sendReply() {
  const I = S.inbox, d = I.detail
  const body = ($('ib-reply')?.value || '').trim()
  if (!body) return
  I.sending = true; I.err = ''; I.reply = body; render()
  try {
    const r = await api('POST', d._k === 'email' ? `/inbox/${d.id}/reply` : `/feedback/${d.id}/reply`, { body })
    toast('Reply sent to ' + r.sentTo)
    I.reply = ''
    await loadInbox(); await openItem(d._k, d.id)
  } catch (e) { I.err = e.message }
  I.sending = false; render()
}
async function setItemStatus(done) {
  const d = S.inbox.detail
  try {
    if (d._k === 'email') await api('PATCH', '/inbox/' + d.id, { status: done ? 'done' : 'open' })
    else await api('PATCH', '/feedback/' + d.id, { status: done ? 'resolved' : 'open' })
    toast(done ? 'Marked as done' : 'Moved back to open')
    await loadInbox(); await openItem(d._k, d.id)
  } catch (e) { toast(e.message) }
}
async function deleteItem() {
  const d = S.inbox.detail
  if (!(await ask({ title: 'Delete this email?', message: 'It will be removed from the inbox permanently.', ok: 'Delete', danger: true }))) return
  try { await api('DELETE', '/inbox/' + d.id); S.inbox.sel = null; S.inbox.detail = null; toast('Deleted'); await loadInbox() } catch (e) { toast(e.message) }
}

function renderInbox() {
  const I = S.inbox
  const items = inboxItems()
  const tab = (id, label, n) => `<button class="${I.tab === id ? 'on' : ''}" data-ibtab="${id}">${label}${n ? ` (${n})` : ''}</button>`
  const list = I.loading && !items.length ? `<div class="loading"><div class="spinner"></div></div>`
    : !items.length ? `<div class="empty"><strong>Nothing here</strong>${I.status === 'open' ? 'You’re all caught up.' : 'No messages yet.'}</div>`
    : items.map(m => {
      const on = I.sel && I.sel.id === m.id
      if (m._k === 'email') return `<button class="ib-item ${on ? 'on' : ''} ${!m.read ? 'unread' : ''} ${m.status === 'done' ? 'done' : ''}" data-open="email:${m.id}">
        <div class="av">${esc(initials(m.from_name || m.from_addr))}</div>
        <div class="ib-body"><div class="ib-l1"><span class="ib-from">${esc(m.from_name || m.from_addr)}</span>${!m.read ? '<span class="ib-dot"></span>' : ''}<span class="ib-time">${ago(m.received_at)}</span></div>
          <div class="ib-subj">${esc(m.subject || '(no subject)')}</div><div class="ib-snip">${esc(m.preview || '')}</div>
          <div class="ib-l3"><span class="badge b-ac">Email</span>${m.reply_count ? `<span class="badge b-green">Replied</span>` : ''}${m.attachment_count ? `<span class="badge b-gray">${m.attachment_count} attachment${m.attachment_count > 1 ? 's' : ''}</span>` : ''}</div></div></button>`
      const k = KIND[m.kind] || KIND.suggestion
      return `<button class="ib-item ${on ? 'on' : ''} ${m.status === 'open' ? 'unread' : 'done'}" data-open="site:${m.id}">
        <div class="av" style="background:var(--s2);color:var(--t2)">${esc(initials(m.email || 'G'))}</div>
        <div class="ib-body"><div class="ib-l1"><span class="ib-from">${esc(m.email || 'Guest (no email)')}</span><span class="ib-time">${ago(m.created_at)}</span></div>
          <div class="ib-subj">${esc(k[0])} · #${m.id.slice(0, 8).toUpperCase()}</div><div class="ib-snip">${esc(m.message)}</div>
          <div class="ib-l3"><span class="badge ${k[1]}">${k[0]}</span><span class="badge b-gray">Site message</span></div></div></button>`
    }).join('')

  return `<div class="ib ${I.sel ? 'has-sel' : ''}">
    <div class="ib-list">
      <div class="ib-tools">
        <div class="seg" style="width:100%">${tab('all', 'All')}${tab('email', 'Emails', I.unread)}${tab('site', 'Site messages', I.open)}</div>
        <div class="row"><div class="seg">${['open', 'done', 'all'].map(s => `<button class="${I.status === s ? 'on' : ''}" data-ibstatus="${s}">${s[0].toUpperCase() + s.slice(1)}</button>`).join('')}</div>
          <button class="btn btn-sm btn-ghost" data-act="inbox-refresh">${svg('refresh')}</button></div>
      </div>
      <div class="ib-items">${list}</div>
    </div>
    <div class="ib-view">${renderDetail()}</div>
  </div>`
}

function renderDetail() {
  const I = S.inbox, d = I.detail
  if (!I.sel) return `<div class="ib-placeholder"><div>${svg('inbox').replace('<svg', '<svg style="width:40px;height:40px;fill:none;stroke:#C7C7DA;stroke-width:1.6;display:block;margin:0 auto 10px"')}Choose a message to read it</div></div>`
  if (I.detailLoading || !d) return `<div class="loading"><div class="spinner"></div></div>`
  const back = `<button class="btn btn-sm ib-back" data-act="inbox-back">${svg('back')} Back</button>`
  const replies = (d.replies || []).map(r => `<div class="reply-sent"><div class="hd">You replied to ${esc(r.sent_to)} · ${fmtDate(r.sent_at)} ${new Date(r.sent_at).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })}</div>${esc(r.body)}</div>`).join('')
  const canReply = d._k === 'email' || !!d.email
  const done = d._k === 'email' ? d.status === 'done' : d.status === 'resolved'
  const actions = `<div class="ib-actions">
    <button class="btn btn-sm" data-act="${done ? 'reopen' : 'done'}">${svg('check')} ${done ? 'Reopen' : 'Mark done'}</button>
    ${d._k === 'email' ? `<button class="btn btn-sm btn-danger" data-act="delete">Delete</button>` : ''}</div>`
  const composer = canReply ? `<div class="composer">
      <textarea id="ib-reply" class="inp" rows="6" placeholder="Write your reply…">${esc(I.reply)}</textarea>
      ${I.err ? `<div class="alert alert-err" style="margin:10px 0 0">${esc(I.err)}</div>` : ''}
      <div class="row"><span class="from">From <b>support@cvmaster.live</b> to ${esc(d._k === 'email' ? d.from_addr : d.email)}</span>
        <button class="btn btn-primary" data-act="reply" ${I.sending ? 'disabled' : ''}>${I.sending ? 'Sending…' : 'Send reply'}</button></div>
    </div>` : `<p class="ib-note">This person didn’t leave an email address, so you can’t reply.</p>`

  if (d._k === 'email') return `<div class="ib-msg">${back}
    <div class="ib-subject">${esc(d.subject || '(no subject)')}</div>
    <div class="ib-meta"><div class="av">${esc(initials(d.from_name || d.from_addr))}</div>
      <div class="who"><b>${esc(d.from_name || d.from_addr)}</b><span>${esc(d.from_addr)} · to ${esc(d.to_addrs || 'support')} · ${fmtDate(d.received_at)} ${new Date(d.received_at).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })}</span></div>${actions}</div>
    ${d.html_body ? `${hasRemoteImages(d.html_body) && !S.inbox.showImages ? `<div class="ib-imgbar">Images from the web are hidden. They can tell the sender you opened the email. <button class="btn btn-sm" data-act="ib-images">Show images</button></div>` : ''}
      <iframe id="ib-frame" class="ib-frame" sandbox="allow-popups allow-popups-to-escape-sandbox allow-same-origin" title="Email"></iframe><p class="ib-note">Shown safely: scripts never run${S.inbox.showImages ? '' : ', and images from the web stay hidden until you show them'}. Links open in a new tab.</p>`
      : d.bodyError === 'restricted_api_key' ? `<div class="alert alert-error">This email’s content couldn’t be loaded: the Resend API key on the server can only send emails.
          In Resend → API Keys, create a key with <b>Full access</b> and add it on Render as <code>RESEND_INBOUND_API_KEY</code>. Then open this email again, it loads automatically.
          Meanwhile you can read it in Resend → Emails → Receiving.</div>`
      : d.bodyError && d.bodyError !== 'empty' ? `<div class="alert alert-error">This email’s content couldn’t be loaded from Resend (${esc(d.bodyError)}). Open it in Resend → Emails → Receiving, or try again in a minute.</div>`
      : `<div class="ib-content">${d.text_body ? linkify(d.text_body) : esc('(This email has no text content.)')}</div>`}
    ${(d.attachments || []).length ? `<div class="ib-atts">${d.attachments.map(a => a.id
        ? `<a class="ib-att" href="/api/admin/inbox/${d.id}/attachments/${a.id}" download="${esc(a.filename || 'attachment')}">📎 ${esc(a.filename || 'attachment')}<span>${fmtSize(a.size)}</span></a>`
        : `<span class="ib-att off">📎 ${esc(a.filename || 'attachment')}<span>${fmtSize(a.size)}</span></span>`).join('')}</div>
      ${d.attachments.some(a => !a.id) ? '<p class="ib-note">Some attachments can’t be downloaded here yet. Add a full-access Resend key as RESEND_INBOUND_API_KEY, or open them in Resend → Emails → Receiving.</p>' : ''}` : ''}
    <div class="thread">${replies}</div>${composer}</div>`

  const k = KIND[d.kind] || KIND.suggestion
  return `<div class="ib-msg">${back}
    <div class="ib-subject">${esc(k[0])} <span class="muted" style="font-weight:600;font-size:15px">#${d.id.slice(0, 8).toUpperCase()}</span></div>
    <div class="ib-meta"><div class="av" style="background:var(--s2);color:var(--t2)">${esc(initials(d.email || 'G'))}</div>
      <div class="who"><b>${esc(d.email || 'Guest, no email')}</b><span>${d.signed_in ? 'Signed-in user' : 'Guest'} · ${fmtDate(d.created_at)}${d.page ? ' · sent from ' + esc(d.page) : ''}</span></div>${actions}</div>
    <div class="ib-content">${esc(d.message)}</div>
    <div class="thread">${replies}</div>${composer}</div>`
}

// ── Users ─────────────────────────────────────────────────────────────────────
async function loadUsers(page = 1) {
  S.usersLoading = true; S.userPage = page; render()
  try { const q = new URLSearchParams({ page, search: S.uSearch }); const d = await api('GET', '/users?' + q); S.users = d.users; S.userTotal = d.total; S.userPages = Math.max(1, d.pages) } catch (e) { toast(e.message) }
  S.usersLoading = false; render()
}
async function editCount(id, field, label, cur) {
  const v = await askText({ title: label, message: `Currently ${cur}. Enter the new amount.`, value: String(cur) })
  if (v === null) return
  const n = parseInt(v, 10)
  if (isNaN(n) || n < 0) { toast('Enter a whole number (0 or more).'); return }
  try { await api('PATCH', `/users/${id}`, { [field]: n }); toast('Updated'); await loadUsers(S.userPage) } catch (e) { toast(e.message) }
}
async function deleteUser(id, email) {
  if (!(await ask({ title: 'Delete this account?', message: `${email} and all their CVs will be deleted permanently. This can’t be undone.`, ok: 'Delete account', danger: true }))) return
  try { await api('DELETE', `/users/${id}`); toast('User deleted'); await loadUsers(S.userPage) } catch (e) { toast(e.message) }
}
function renderUsers() {
  const pages = S.userPages
  const start = Math.max(1, Math.min(pages - 6, S.userPage - 3))
  return `<div class="card">
    <div class="card-hd"><h3>${fmt(S.userTotal)} users</h3>
      <form data-form="user-search" style="display:flex;gap:8px"><input class="inp" id="u-q" placeholder="Search name or email…" value="${esc(S.uSearch)}" style="width:240px"><button class="btn">Search</button></form></div>
    ${S.usersLoading ? `<div class="loading"><div class="spinner"></div></div>` : `
    <table class="tbl cards users-tbl"><thead><tr><th>User</th><th>Sign-in</th><th>Joined</th><th>CVs</th><th>Paid</th><th>Free CVs</th><th>AI credits</th><th>Referred</th><th></th></tr></thead>
    <tbody>${!S.users.length ? `<tr><td colspan="9"><div class="empty">No users found</div></td></tr>` : S.users.map(u => `<tr>
      <td class="full"><div class="u-who"><div class="av">${esc(initials(u.name || u.email))}</div><div><b>${esc(u.name || u.email.split('@')[0])}</b><span>${esc(u.email)}</span></div></div></td>
      <td data-label="Sign-in"><span class="badge ${u.provider === 'google' ? 'b-sky' : u.provider === 'apple' ? 'b-gray' : 'b-gray'}">${esc(u.provider === 'google' ? 'Google' : u.provider === 'apple' ? 'Apple' : 'Email')}</span></td>
      <td data-label="Joined">${fmtDate(u.created_at)}</td>
      <td data-label="CVs">${fmt(u.draft_count)}</td><td data-label="Paid">${fmt(u.payment_count)}</td>
      <td data-label="Free CVs"><span class="num-edit"><b>${fmt(u.referral_credits)}</b><button class="btn btn-sm btn-ghost" data-edit="referral_credits" data-id="${u.id}" data-cur="${u.referral_credits}" data-label="Free CV credits for ${esc(u.email)}">Edit</button></span></td>
      <td data-label="AI credits"><span class="num-edit"><b>${fmt(u.ai_credits)}</b><button class="btn btn-sm btn-ghost" data-edit="ai_credits" data-id="${u.id}" data-cur="${u.ai_credits || 0}" data-label="Extra AI requests for ${esc(u.email)}">Edit</button></span></td>
      <td data-label="Invited">${fmt(u.referred_count)}</td>
      <td class="full acts" style="white-space:nowrap"><button class="btn btn-sm" data-act="email-user" data-email="${esc(u.email)}">Email</button> <button class="btn btn-sm btn-danger" data-del="${u.id}" data-email="${esc(u.email)}">Delete</button></td></tr>`).join('')}</tbody></table>
    <div class="pager"><span>Page ${S.userPage} of ${pages}</span><div class="pg">
      ${S.userPage > 1 ? `<button class="btn btn-sm" data-page="${S.userPage - 1}">‹</button>` : ''}
      ${Array.from({ length: Math.min(7, pages) }, (_, i) => start + i).map(p => `<button class="btn btn-sm ${p === S.userPage ? 'btn-primary' : ''}" data-page="${p}">${p}</button>`).join('')}
      ${S.userPage < pages ? `<button class="btn btn-sm" data-page="${S.userPage + 1}">›</button>` : ''}</div></div>`}
  </div>`
}

// ── Subscribers ───────────────────────────────────────────────────────────────
async function loadSubs() {
  S.subsLoading = !S.subs; render()
  try { S.subs = await api('GET', '/newsletter/subscribers') } catch (e) { toast(e.message) }
  S.subsLoading = false; render()
}
async function subAction(id, act, email) {
  try {
    if (act === 'unsub') {
      if (!(await ask({ title: 'Unsubscribe this person?', message: `${email} will stop receiving the newsletter.`, ok: 'Unsubscribe' }))) return
      await api('PATCH', '/newsletter/subscribers/' + id, { status: 'unsubscribed' }); toast('Unsubscribed')
    }
    if (act === 'del') {
      if (!(await ask({ title: 'Delete from the list?', message: `${email} will be removed completely. Use this when someone asks for their data to be erased.`, ok: 'Delete', danger: true }))) return
      await api('DELETE', '/newsletter/subscribers/' + id); toast('Deleted')
    }
    await loadSubs()
  } catch (e) { toast(e.message) }
}
function exportSubs() {
  const rows = (S.subs?.items || []).filter(x => x.status === 'subscribed')
  const cell = (v) => '"' + String(v ?? '').replace(/"/g, '""') + '"'
  const csv = 'email,name,source,consent_at\n' + rows.map(x => [x.email, x.name, x.source, x.consent_at].map(cell).join(',')).join('\n')
  const a = document.createElement('a')
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = 'cvmaster-subscribers.csv'; a.click()
}
function renderSubs() {
  if (S.subsLoading || !S.subs) return `<div class="loading"><div class="spinner"></div></div>`
  const d = S.subs, f = S.subFilter || 'subscribed', q = (S.subQ || '').toLowerCase()
  const STATUS = { subscribed: ['Subscribed', 'b-green'], pending: ['Waiting for confirmation', 'b-amber'], unsubscribed: ['Unsubscribed', 'b-gray'] }
  const SOURCE = { homepage: 'Homepage form', blog: 'Blog form', signup: 'Sign-up box', settings: 'Settings' }
  const LABEL  = { subscribed: 'subscribed', pending: 'waiting for confirmation', unsubscribed: 'unsubscribed', all: 'people' }
  const items = d.items.filter(x => (f === 'all' || x.status === f) && (!q || x.email.includes(q) || (x.name || '').toLowerCase().includes(q)))
  return `
  <div class="kpis" style="grid-template-columns:repeat(3,1fr)">
    <div class="card kpi"><div class="kpi-l">Subscribed</div><div class="kpi-v">${fmt(d.counts.subscribed)}</div><div class="kpi-s">Receive the newsletter</div></div>
    <div class="card kpi"><div class="kpi-l">Waiting for confirmation</div><div class="kpi-v">${fmt(d.counts.pending)}</div><div class="kpi-s">Haven’t clicked the link yet, not emailed</div></div>
    <div class="card kpi"><div class="kpi-l">Unsubscribed</div><div class="kpi-v">${fmt(d.counts.unsubscribed)}</div><div class="kpi-s">Never emailed again</div></div>
  </div>
  <div class="card">
    <div class="card-hd"><h3>${fmt(items.length)} ${LABEL[f]}</h3>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <select class="inp" id="sub-f" style="width:auto">${[['subscribed', 'Subscribed'], ['pending', 'Waiting'], ['unsubscribed', 'Unsubscribed'], ['all', 'Everyone']].map(([v, l]) => `<option value="${v}"${v === f ? ' selected' : ''}>${l}</option>`).join('')}</select>
        <input class="inp" id="sub-q" placeholder="Search name or email…" value="${esc(S.subQ || '')}" style="width:210px">
        <button class="btn" data-act="sub-export">Export CSV</button>
      </div></div>
    <table class="tbl cards"><thead><tr><th>Person</th><th>Status</th><th>Where they agreed</th><th>Plan</th><th>Agreed on</th><th></th></tr></thead>
    <tbody>${!items.length ? `<tr><td colspan="6"><div class="empty"><strong>Nobody here yet</strong>People join from the homepage form, the box at sign-up, or Settings.</div></td></tr>` : items.map(x => {
      const st = STATUS[x.status] || STATUS.pending
      return `<tr>
        <td class="full"><div class="u-who"><div class="av">${esc(initials(x.name || x.email))}</div><div><b>${esc(x.name || x.email.split('@')[0])}</b><span>${esc(x.email)}</span></div></div></td>
        <td data-label="Status"><span class="badge ${st[1]}">${st[0]}</span></td>
        <td data-label="Where they agreed">${esc(SOURCE[x.source] || x.source || '—')}</td>
        <td data-label="Plan">${x.plan ? esc(x.plan) : '<span class="muted">No account</span>'}</td>
        <td data-label="Agreed on">${x.status === 'unsubscribed' ? '<span class="muted">Left ' + fmtDate(x.unsubscribed_at) + '</span>' : x.consent_at ? fmtDate(x.consent_at) : '<span class="muted">—</span>'}</td>
        <td class="full acts" style="white-space:nowrap;text-align:right">${x.status !== 'unsubscribed' ? `<button class="btn btn-sm" data-sub="${x.id}" data-sact="unsub" data-email="${esc(x.email)}">Unsubscribe</button> ` : ''}<button class="btn btn-sm btn-danger" data-sub="${x.id}" data-sact="del" data-email="${esc(x.email)}">Delete</button></td></tr>`
    }).join('')}</tbody></table>
  </div>
  <p class="muted" style="font-size:12.5px;margin-top:12px">Only people who agreed are listed. You can unsubscribe or delete someone (for example if they ask by email), but you can’t add people. They have to sign up themselves.</p>`
}

// ── Reviews ───────────────────────────────────────────────────────────────────
async function loadReviews() {
  S.rvLoading = !S.rv; render()
  try { S.rv = await api('GET', '/reviews') } catch (e) { toast(e.message) }
  S.rvLoading = false; render()
}
async function setReview(id, status) {
  try {
    if (status === 'upd-approve' || status === 'upd-reject') {
      await api('PATCH', '/reviews/' + id, { update: status === 'upd-approve' ? 'approve' : 'reject' })
      toast(status === 'upd-approve' ? 'The edit is now on the homepage' : 'Kept the published version')
    } else {
      await api('PATCH', '/reviews/' + id, { status })
      toast(status === 'approved' ? 'Approved. Shown on the homepage' : status === 'hidden' ? 'Hidden' : 'Shown again')
    }
    await loadReviews(); loadCounts()
  } catch (e) { toast(e.message) }
}
async function saveReviewsShow(show) {
  try { await api('PUT', '/reviews/settings', { show }); toast(show ? 'Reviews are on for the homepage' : 'Reviews are off: the homepage has no reviews section'); await loadReviews() } catch (e) { toast(e.message) }
}
async function saveReviewsMin() {
  const n = Number(document.getElementById('rv-min')?.value)
  try {
    await api('PUT', '/reviews/settings', { minToShow: n })
    toast(S.rv && S.rv.count >= n ? 'Saved. Reviews now show on the homepage' : `Saved. Reviews show once there are ${n}`)
    await loadReviews()
  } catch (e) { toast(e.message) }
}
function renderReviews() {
  if (S.rvLoading || !S.rv) return `<div class="loading"><div class="spinner"></div></div>`
  const r = S.rv
  const stars = (n) => `<span style="color:#F59E0B;letter-spacing:1px">${'★'.repeat(n)}</span><span style="color:var(--b2)">${'★'.repeat(5 - n)}</span>`
  return `
  <div class="kpis" style="grid-template-columns:repeat(3,1fr)">
    <div class="card kpi"><div class="kpi-l">Average rating</div><div class="kpi-v">${r.average ? r.average.toFixed(1) : '—'}</div><div class="kpi-s">${r.average ? stars(Math.round(r.average)) : 'No reviews yet'}</div></div>
    <div class="card kpi"><div class="kpi-l">Reviews counted</div><div class="kpi-v">${fmt(r.count)}</div><div class="kpi-s">${r.count >= r.minToShow ? 'Shown on the homepage and to Google' : `Shown once there are ${r.minToShow}`}</div></div>
    <div class="card kpi"><div class="kpi-l">Waiting for you</div><div class="kpi-v">${fmt(r.pending)}</div><div class="kpi-s">New comments and edits to approve</div></div>
  </div>
  <div class="card" style="margin-bottom:16px"><div class="card-bd rv-set">
    <div><b>Reviews on the homepage</b>

        </div></div>`
    }).join('')}

}

const statusCounts = () => {
  const c = S.status?.checks || []
  return { down: c.filter(x => x.state === 'down'), warn: c.filter(x => x.state === 'warn') }
}
function renderStatus() {
  const st = S.status
  if (!st) return `<div class="loading"><div class="spinner"></div></div>`
  const { down, warn } = statusCounts()
  const ic = { ok: svg('check'), warn: '!', down: '×' }
  const banner = down.length ? `<div class="st-banner down">${down.length} not working: ${down.map(c => esc(c.name)).join(', ')}<span>checked ${fmtDate(st.at)}</span></div>`
    : warn.length ? `<div class="st-banner warn">Everything is working · ${warn.length} to look at<span>checked ${fmtDate(st.at)}</span></div>`
    : `<div class="st-banner ok">Everything is working<span>checked ${fmtDate(st.at)}</span></div>`
  let group = ''
  const rows = st.checks.map(c => {
    const head = c.group !== group ? `<div class="st-group">${esc(group = c.group)}</div>` : ''
    return head + `<div class="chk"><span class="chk-ic ${c.state === 'ok' ? 'ok' : c.state === 'down' ? 'down' : 'no'}">${ic[c.state] || '!'}</span><div><span class="chk-t">${esc(c.name)}</span><span>${esc(c.detail || '')}</span></div></div>`
  }).join('')
  return banner + rows + `<p class="muted" style="font-size:12px;margin-top:14px">Checked again every 30 minutes while people use CVMaster. ${st.alertsTo ? `When something stops working, or works again, an email goes to <b>${esc(st.alertsTo)}</b>.` : 'Set ADMIN_EMAIL in Render to be emailed when something stops working.'} If the whole server goes down nothing here can run, so also add a free outside monitor (for example UptimeRobot) on <code>https://api.cvmaster.live/api/health</code> and <code>https://www.cvmaster.live</code>.</p>`

function addBlock(type) {
  const def = BLOCK_DEFS[type];
  if(!def) return;
  S.blocks.push({ id:uid(), type, ...JSON.parse(JSON.stringify(def.defaults)) });
  render(); refreshPreview();
}
function removeBlock(id) { S.blocks=S.blocks.filter(b=>b.id!==id); render(); refreshPreview(); }
function moveBlock(id,dir) {
  const i=S.blocks.findIndex(b=>b.id===id);
  if(dir===-1&&i>0){[S.blocks[i-1],S.blocks[i]]=[S.blocks[i],S.blocks[i-1]];}
  if(dir===1&&i<S.blocks.length-1){[S.blocks[i],S.blocks[i+1]]=[S.blocks[i+1],S.blocks[i]];}
  render(); refreshPreview();
}
function updateBlock(id,field,value,subIdx) {
  const b=S.blocks.find(b=>b.id===id); if(!b) return;
  if(subIdx!==undefined&&Array.isArray(b.links)){b.links[subIdx][field]=value;}
  else b[field]=value;
  refreshPreview();
}

function simpleMarkdown(text) {
  // Support **bold** and *italic* in text blocks
  return (text||'')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,'<em>$1</em>')
    .replace(/\n/g,'<br>');
}

// The preview shows exactly what recipients get. The server adds the footer for the chosen
// audience. Refreshed shortly after each change
let _pvTimer = null, _pvSeq = 0
function refreshPreview() {
  clearTimeout(_pvTimer)
  _pvTimer = setTimeout(async () => {
    const mine = ++_pvSeq
    const plan = $('e-plan-sel')?.value || S.email.plan
    try {
      const p = await api('POST', '/email/preview', { subject: $('e-subject')?.value || S.email.subject, body: buildEmailHtml(), audience: plan === 'users' ? 'all_users' : plan === 'people' ? 'people' : 'subscribers' })
      if (mine !== _pvSeq) return
      S.pv = p
      const f = $('e-preview'); if (f) f.srcdoc = pvDoc(p.html)
      const h = $('pv-head'); if (h) h.innerHTML = pvHead()
    } catch {}
  }, 350)
}
// Dark mode preview: the Gmail and Outlook phone apps flip an email's light colours to dark ones
// and leave images as they are. Inverting the page and then inverting images back again is
// close to what they do.
const PV_DARK = '<style>html{filter:invert(1) hue-rotate(180deg);background:#fff}img,video,picture,[style*="background-image"]{filter:invert(1) hue-rotate(180deg)}</style>'
const pvDoc = (html) => S.pvDark ? html.replace(/<head[^>]*>/i, m => m + PV_DARK).replace(/^(?![\s\S]*<head)/, PV_DARK) : html
const pvHead = () => S.pv ? `<div><b>From</b> ${esc(S.pv.from)}</div><div><b>Reply to</b> ${esc(S.pv.replyTo)}</div><div><b>Subject</b> ${esc(S.pv.subject)}</div>` : ''

async function copyHtml() {
  try { await navigator.clipboard.writeText(buildEmailHtml()); toast('Email HTML copied'); }
  catch { toast('Could not copy, try again.'); }
}

}


// ── Dialogs ───────────────────────────────────────────────────────────────────
// Our own confirm / text-input dialog (never the browser's confirm, prompt or alert).
// ask({ title, message, ok, danger }) → true/false; askText({ title, message, value, ok }) → string or null
function dialog({ title, message = '', ok = 'Confirm', cancel = 'Cancel', danger = false, input = null }) {
  return new Promise(resolve => {
    const wrap = document.createElement('div')
    wrap.className = 'dlg-back'
    wrap.innerHTML = `<div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlg-t">
      <div class="dlg-t" id="dlg-t">${esc(title)}</div>
      ${message ? `<div class="dlg-m">${esc(message)}</div>` : ''}
      ${input !== null ? `<input class="inp dlg-in" value="${esc(input)}">` : ''}
      <div class="dlg-f"><button class="btn" data-x="0">${esc(cancel)}</button><button class="btn ${danger ? 'btn-danger-solid' : 'btn-primary'}" data-x="1">${esc(ok)}</button></div></div>`
    const field = wrap.querySelector('.dlg-in')
    const done = (yes) => {
      document.removeEventListener('keydown', onKey, true)
      wrap.remove()
      resolve(input !== null ? (yes ? field.value.trim() || null : null) : !!yes)
    }
    const onKey = (e) => { if (e.key === 'Escape') { e.preventDefault(); done(false) } if (e.key === 'Enter') { e.preventDefault(); done(true) } }
    wrap.addEventListener('click', (e) => { if (e.target === wrap) done(false); const b = e.target.closest('[data-x]'); if (b) done(b.dataset.x === '1') })
    document.addEventListener('keydown', onKey, true)
    document.body.appendChild(wrap)
    ;(field || wrap.querySelector('[data-x="1"]')).focus()
    field?.select()
  })
}
