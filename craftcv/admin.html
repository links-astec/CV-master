<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>CVMaster Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --night:#14142B;--night2:#1d1d3a;--night3:#2a2a4d;
  --ac:#4338CA;--ac2:#3730a3;--ac-lt:#EEF0FF;--ac-ring:rgba(67,56,202,.18);
  --bg:#F6F6FB;--s1:#FFFFFF;--s2:#F3F3F9;--b1:#E7E7F0;--b2:#D5D5E3;
  --t1:#14142B;--t2:#55556F;--t3:#8A8AA3;
  --green:#16A34A;--green-lt:#E9F8EF;--amber:#B45309;--amber-lt:#FEF5E7;--red:#DC2626;--red-lt:#FDECEC;--sky:#0369A1;--sky-lt:#E8F4FB;
  --r:12px;--f:'Plus Jakarta Sans',-apple-system,Segoe UI,sans-serif;
  --shadow:0 1px 2px rgba(20,20,43,.05),0 1px 3px rgba(20,20,43,.05);
  --shadow-lg:0 12px 32px rgba(20,20,43,.10);
}
html,body{height:100%;background:var(--bg);color:var(--t1);font-family:var(--f);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
a{color:var(--ac)}

/* ── Shell ── */
.app{display:flex;height:100vh;overflow:hidden}
.sb{width:236px;background:var(--night);color:#C7C7E0;display:flex;flex-direction:column;flex-shrink:0}
.sb-head{display:flex;align-items:center;gap:10px;padding:20px 18px 18px}
.sb-mark{width:30px;height:30px;border-radius:9px;background:var(--ac);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sb-mark svg{width:18px;height:18px}
.sb-name{font-size:16px;font-weight:800;color:#fff;letter-spacing:-.01em}
.sb-name span{color:#A5B4FC}
.sb-tag{margin-left:auto;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#A5B4FC;background:rgba(165,180,252,.12);padding:3px 8px;border-radius:99px}
.sb-nav{flex:1;padding:6px 10px;display:flex;flex-direction:column;gap:2px}
.nav{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;color:#C7C7E0;font-size:14px;font-weight:600;border:none;background:none;text-align:left;width:100%}
.nav:hover{background:var(--night2);color:#fff}
.nav.on{background:var(--night3);color:#fff}
.nav svg{width:18px;height:18px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav .count{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--ac);color:#fff;font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
.sb-foot{padding:14px 16px;border-top:1px solid rgba(255,255,255,.07);display:flex;align-items:center;gap:10px}
.sb-av{width:32px;height:32px;border-radius:50%;background:var(--night3);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sb-mail{flex:1;min-width:0;font-size:12.5px;color:#C7C7E0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-out{border:none;background:none;color:#8A8AA3;padding:6px;border-radius:8px}
.sb-out:hover{color:#fff;background:var(--night2)}
.sb-out svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}

.main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{height:64px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 28px;background:var(--s1);border-bottom:1px solid var(--b1);flex-shrink:0}
.top h1{font-size:18px;font-weight:800;letter-spacing:-.02em}
.top p{font-size:12.5px;color:var(--t3)}
.top-r{display:flex;align-items:center;gap:8px}
.content{flex:1;overflow-y:auto;padding:24px 28px 40px}
.content.flush{padding:0;overflow:hidden;display:flex}

/* ── Controls ── */
.btn{height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--b1);background:var(--s1);color:var(--t1);font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover:not(:disabled){border-color:var(--b2);background:var(--s2)}
.btn-primary{background:var(--ac);border-color:var(--ac);color:#fff}
.btn-primary:hover:not(:disabled){background:var(--ac2);border-color:var(--ac2)}
.btn-danger{color:var(--red)}
.btn-danger:hover:not(:disabled){background:var(--red-lt);border-color:#F5C2C2}
.btn-ghost{border-color:transparent;background:none;color:var(--t2)}
.btn-sm{height:30px;padding:0 11px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
a.btn{text-decoration:none}
.btn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.inp{height:38px;width:100%;background:var(--s1);border:1px solid var(--b1);border-radius:10px;padding:0 12px;color:var(--t1);font-size:13.5px;font-family:inherit;outline:none;transition:border-color .12s,box-shadow .12s}
textarea.inp{height:auto;padding:10px 12px;line-height:1.55;resize:vertical}
.inp:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--ac-ring)}
.inp::placeholder{color:var(--t3)}
.lbl{display:block;font-size:12.5px;font-weight:600;color:var(--t2);margin-bottom:6px}
.seg{display:inline-flex;background:var(--s2);border:1px solid var(--b1);border-radius:10px;padding:3px;gap:2px}
.seg button{height:28px;padding:0 12px;border:none;border-radius:7px;background:none;font-size:12.5px;font-weight:600;color:var(--t2)}
.seg button.on{background:var(--s1);color:var(--t1);box-shadow:var(--shadow)}
.badge{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:99px;font-size:11.5px;font-weight:700;white-space:nowrap}
.b-gray{background:var(--s2);color:var(--t2)}.b-ac{background:var(--ac-lt);color:var(--ac)}.b-green{background:var(--green-lt);color:var(--green)}
.b-amber{background:var(--amber-lt);color:var(--amber)}.b-red{background:var(--red-lt);color:var(--red)}.b-sky{background:var(--sky-lt);color:var(--sky)}
.spinner{width:18px;height:18px;border:2px solid var(--b1);border-top-color:var(--ac);border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.loading{display:flex;align-items:center;justify-content:center;padding:48px}
.empty{text-align:center;padding:40px 20px;color:var(--t3);font-size:13.5px}
.empty strong{display:block;color:var(--t2);font-size:14.5px;margin-bottom:4px}
.card{background:var(--s1);border:1px solid var(--b1);border-radius:16px;box-shadow:var(--shadow)}
.card-hd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--b1)}
.card-hd h3{font-size:14.5px;font-weight:700}
.card-bd{padding:16px 20px}
.alert{padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:10px}
.alert-ok{background:var(--green-lt);color:var(--green)}
.alert-err{background:var(--red-lt);color:var(--red)}
.av{width:34px;height:34px;border-radius:50%;background:var(--ac-lt);color:var(--ac);font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.muted{color:var(--t3)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--night);color:#fff;padding:11px 18px;border-radius:12px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow-lg);z-index:100}

/* ── Overview ── */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{padding:18px 20px}
.kpi-l{font-size:12.5px;font-weight:600;color:var(--t3)}
.kpi-v{font-size:28px;font-weight:800;letter-spacing:-.03em;margin:4px 0 2px}
.kpi-s{font-size:12.5px;color:var(--t2)}
.kpi-s b{color:var(--green)}
.ov-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:18px;margin-bottom:18px}
.chart{display:flex;align-items:flex-end;gap:6px;height:170px;padding-top:10px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bars{display:flex;align-items:flex-end;gap:3px;height:100%;width:100%;justify-content:center}
.bar{width:40%;max-width:14px;border-radius:4px 4px 0 0;min-height:2px}
.bar.s{background:#C7D2FE}.bar.p{background:var(--ac)}
.bar-x{font-size:10.5px;color:var(--t3)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--t2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.attn{display:flex;flex-direction:column}
.attn-row{display:flex;align-items:center;gap:12px;padding:13px 20px;border-top:1px solid var(--b1);border-left:none;border-right:none;border-bottom:none;background:none;text-align:left;width:100%;font-size:13.5px;color:var(--t1)}
.attn-row:first-child{border-top:none}
.attn-row:hover{background:var(--s2)}
.attn-row .n{margin-left:auto;font-size:18px;font-weight:800}
.attn-ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.attn-ic svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pay-row{display:flex;align-items:center;gap:12px;padding:11px 20px;border-top:1px solid var(--b1)}
.pay-row:first-child{border-top:none}
.pay-who{flex:1;min-width:0}
.pay-who div:first-child{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pay-amt{font-weight:700}

/* ── Inbox ── */
.ib{display:grid;grid-template-columns:380px 1fr;flex:1;min-height:0;width:100%}
.ib-list{border-right:1px solid var(--b1);display:flex;flex-direction:column;min-height:0;background:var(--s1)}
.ib-tools{padding:14px 16px;border-bottom:1px solid var(--b1);display:flex;flex-direction:column;gap:10px}
.ib-tools .row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.ib-items{flex:1;overflow-y:auto}
.ib-item{display:flex;gap:11px;padding:13px 16px;border-bottom:1px solid var(--b1);cursor:pointer;background:none;border-left:3px solid transparent;width:100%;text-align:left;font:inherit;color:inherit}
.ib-item:hover{background:var(--s2)}
.ib-item.on{background:var(--ac-lt);border-left-color:var(--ac)}
.ib-item.done{opacity:.6}
.ib-body{flex:1;min-width:0}
.ib-l1{display:flex;align-items:center;gap:8px}
.ib-from{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib-item.unread .ib-from{font-weight:800}
.ib-time{font-size:11.5px;color:var(--t3);flex-shrink:0}
.ib-subj{font-size:13px;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib-item.unread .ib-subj{font-weight:700}
.ib-snip{font-size:12.5px;color:var(--t3);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ib-dot{width:8px;height:8px;border-radius:50%;background:var(--ac);flex-shrink:0}
.ib-l3{display:flex;gap:6px;margin-top:6px}
.ib-view{overflow-y:auto;min-height:0;background:var(--bg)}
.ib-msg{max-width:820px;margin:0 auto;padding:24px 28px 40px}
.ib-back{display:none}
.ib-subject{font-size:20px;font-weight:800;letter-spacing:-.02em;margin-bottom:12px}
.ib-meta{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.ib-meta .who{flex:1;min-width:0}
.ib-meta .who b{display:block}
.ib-meta .who span{font-size:12.5px;color:var(--t3)}
.ib-actions{display:flex;gap:6px;flex-wrap:wrap}
.ib-content{background:var(--s1);border:1px solid var(--b1);border-radius:14px;padding:18px 20px;font-size:14px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
.ib-frame{width:100%;min-height:360px;border:1px solid var(--b1);border-radius:14px;background:#fff}
.ib-note{font-size:12px;color:var(--t3);margin:8px 2px 0}
.ib-atts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.thread{margin-top:18px;display:flex;flex-direction:column;gap:10px}
.reply-sent{background:var(--ac-lt);border-radius:14px;padding:14px 16px;font-size:13.5px;white-space:pre-wrap;word-break:break-word}
.reply-sent .hd{font-size:12px;color:var(--ac);font-weight:700;margin-bottom:4px;white-space:normal}
.composer{margin-top:18px;background:var(--s1);border:1px solid var(--b1);border-radius:14px;padding:14px 16px}
.composer .row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.composer .from{font-size:12.5px;color:var(--t3)}
.ib-placeholder{height:100%;display:flex;align-items:center;justify-content:center;color:var(--t3);font-size:14px;text-align:center;padding:40px}

/* ── Users ── */
.tbl{width:100%;border-collapse:collapse}
.tbl th{padding:10px 14px;text-align:left;font-size:11.5px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--b1);background:var(--s2)}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--b1);font-size:13.5px;color:var(--t2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:#FAFAFD}
.u-who{display:flex;align-items:center;gap:11px}
.u-who b{display:block;color:var(--t1);font-weight:600}
.u-who span{font-size:12px;color:var(--t3)}
.num-edit{display:inline-flex;align-items:center;gap:6px}
.num-edit b{color:var(--t1);min-width:18px}
.pager{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-top:1px solid var(--b1);font-size:12.5px;color:var(--t3)}
.pager .pg{display:flex;gap:4px}

/* ── Settings ── */
.set-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.chk{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-top:1px solid var(--b1)}
.chk:first-child{border-top:none;padding-top:0}
.chk-ic{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.chk-ic.ok{background:var(--green-lt);color:var(--green)}.chk-ic.no{background:var(--amber-lt);color:var(--amber)}
.chk-ic svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.chk-t{display:block;font-size:13.5px;font-weight:700}
.chk span{font-size:12.5px;color:var(--t2)}
.chk code{font-size:12px;background:var(--s2);padding:1px 6px;border-radius:5px;overflow-wrap:anywhere}
.toggle{position:relative;width:44px;height:24px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0;position:absolute}
.toggle-track{position:absolute;inset:0;background:var(--b2);border-radius:12px;cursor:pointer;transition:background .2s}
.toggle input:checked + .toggle-track{background:var(--red)}
.toggle-track::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.toggle input:checked + .toggle-track::after{transform:translateX(20px)}
.maint{display:flex;align-items:center;justify-content:space-between;gap:16px}

/* ── Newsletter builder (restyled) ── */
.email-layout{display:grid;grid-template-columns:400px 1fr;gap:18px;height:calc(100vh - 64px - 64px)}
.email-left{display:flex;flex-direction:column;gap:12px;overflow-y:auto;padding-right:4px}
.email-right{display:flex;flex-direction:column;min-height:0}
.email-right .card{flex:1;display:flex;flex-direction:column;min-height:0}
.preview-iframe{width:100%;flex:1;border:none;background:#f0f2f5;border-radius:0 0 16px 16px}
.email-toolbar{display:flex;flex-wrap:wrap;gap:6px;padding:12px;background:var(--s1);border:1px solid var(--b1);border-radius:14px}
.tb-label{width:100%;font-size:11px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.06em}
.tb-btn{height:28px;padding:0 10px;border-radius:8px;border:1px solid var(--b1);background:var(--s1);color:var(--t2);font-size:12px;font-weight:600}
.tb-btn:hover{border-color:var(--ac);color:var(--ac)}
.tb-sep{width:100%;height:1px;background:var(--b1);margin:4px 0}
.blocks-container{display:flex;flex-direction:column;gap:8px}
.block-wrap{border:1px solid var(--b1);border-radius:12px;background:var(--s1);overflow:hidden}
.block-wrap.drag-over{border-color:var(--ac);box-shadow:0 0 0 3px var(--ac-ring)}
.block-wrap.dragging{opacity:.4}
.block-header{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--s2);border-bottom:1px solid var(--b1);user-select:none;cursor:grab}
.block-grip{color:var(--t3)}
.block-type-label{flex:1;font-size:11.5px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.05em}
.block-actions{display:flex;gap:3px}
.bc-btn{width:24px;height:24px;border-radius:6px;border:1px solid var(--b1);background:var(--s1);color:var(--t2);font-size:11px}
.bc-btn:hover{color:var(--t1);border-color:var(--b2)}
.bc-btn.del:hover{color:var(--red);border-color:#F5C2C2;background:var(--red-lt)}
.bc-btn:disabled{opacity:.3}
.block-body{padding:10px 12px;display:flex;flex-direction:column;gap:7px}
.bi{width:100%;background:var(--s1);border:1px solid var(--b1);border-radius:8px;padding:7px 9px;color:var(--t1);font-size:12.5px;font-family:inherit;outline:none}
.bi:focus{border-color:var(--ac)}
textarea.bi{resize:vertical;min-height:60px;line-height:1.55}
.bi-row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.bi-label{font-size:11.5px;color:var(--t3);white-space:nowrap}
input[type=color].bi-color{width:32px;height:28px;padding:1px;border-radius:6px;border:1px solid var(--b1);background:var(--s1)}
input[type=range]{flex:1;accent-color:var(--ac)}
.send-panel{background:var(--s1);border:1px solid var(--b1);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.send-panel .row{display:flex;gap:8px}


/* Builder markup aliases */
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--b1)}
.card-head h3{font-size:14px;font-weight:700}
.card-body{padding:14px 18px}
.email-right .card-body{flex:1;display:flex;padding:0;min-height:0}
.form-group{display:flex;flex-direction:column;gap:6px}
.form-label{font-size:12.5px;font-weight:600;color:var(--t2)}
.btn-default{}
.alert-success{background:var(--green-lt);color:var(--green)}
.alert-error{background:var(--red-lt);color:var(--red)}
.flex{display:flex;align-items:center;gap:8px}

/* ── Login ── */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(700px 400px at 50% 0%,#E4E7FF,transparent 70%),var(--bg)}
.login-card{width:100%;max-width:380px;background:var(--s1);border:1px solid var(--b1);border-radius:20px;padding:32px;box-shadow:var(--shadow-lg)}
.login-brand{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:6px}
.login-brand .sb-name{color:var(--t1)}
.login-brand .sb-name span{color:var(--ac)}
.login-sub{text-align:center;color:var(--t3);font-size:13px;margin-bottom:22px}
.login form{display:flex;flex-direction:column;gap:12px}

@media (max-width:1100px){ .kpis{grid-template-columns:1fr 1fr} .ov-grid,.set-grid{grid-template-columns:1fr} }
@media (max-width:900px){
  .email-layout{grid-template-columns:1fr;height:auto}
  .email-right{height:520px}
  .ib{grid-template-columns:1fr}
  .ib.has-sel .ib-list{display:none}
  .ib:not(.has-sel) .ib-view{display:none}
  .ib-back{display:inline-flex;margin-bottom:12px}
}
@media (max-width:760px){
  .app{flex-direction:column;height:auto;min-height:100vh}
  .sb{width:100%;flex-direction:row;flex-wrap:wrap;align-items:center}
  .sb-head{padding:12px 14px}
  .sb-nav{flex:0 0 100%;flex-direction:row;overflow-x:auto;padding:0 8px 10px;order:3}
  .nav{width:auto;white-space:nowrap}
  .sb-foot{border:none;margin-left:auto;padding:8px 12px}
  .sb-mail{display:none}
  .top{padding:0 16px;height:auto;min-height:58px;flex-wrap:wrap;padding-top:10px;padding-bottom:10px}
  .content{padding:16px}
  .content.flush{height:calc(100vh - 170px)}
  .kpis{grid-template-columns:1fr 1fr;gap:10px}
  .kpi-v{font-size:22px}
  .tbl{display:block;overflow-x:auto}
  .ib-msg{padding:16px}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ── State ─────────────────────────────────────────────────────────────────────
const S = {
  auth: null, page: 'overview',
  stats: null, statsLoading: false, maintenance: false, maintLoading: false,
  users: [], userTotal: 0, userPage: 1, userPages: 1, usersLoading: false, uSearch: '',
  inbox: { tab: 'all', status: 'open', emails: [], site: [], unread: 0, open: 0, loading: false, sel: null, detail: null, detailLoading: false, reply: '', sending: false, err: '' },
  config: null,
  email: { subject: '', plan: 'all', testTo: '', sending: false, sent: false, sentCount: 0, err: '' },
  blocks: [], dragSrc: null,
  login: { email: '', password: '', err: '', loading: false },
  toast: '',
};

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fmt = n => Number(n || 0).toLocaleString('en-GB');
const eur = c => '€' + (Number(c || 0) / 100).toFixed(2);
const fmtDate = s => s ? new Date(s).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : '—';
const initials = s => (String(s || '?').replace(/@.*/, '').split(/[\s._-]+/).filter(Boolean).map(w => w[0]).join('').slice(0, 2) || '?').toUpperCase();
function ago(s) {
  if (!s) return ''
  const d = (Date.now() - new Date(s)) / 1000
  if (d < 60) return 'now'
  if (d < 3600) return Math.floor(d / 60) + 'm'
  if (d < 86400) return Math.floor(d / 3600) + 'h'
  if (d < 86400 * 7) return Math.floor(d / 86400) + 'd'
  return new Date(s).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })
}
let _uid = 0; const uid = () => ++_uid;
let _toastT;
function toast(msg) { S.toast = msg; render(); clearTimeout(_toastT); _toastT = setTimeout(() => { S.toast = ''; render() }, 3200) }

const ICON = {
  overview: '<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',
  inbox: '<polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11L2 12v6a2 2 0 002 2h16a2 2 0 002-2v-6l-3.45-6.89A2 2 0 0016.76 4H7.24a2 2 0 00-1.79 1.11z"/>',
  users: '<path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/>',
  newsletter: '<path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/>',
  reviews: '<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>',
  settings: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/>',
  out: '<path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>',
  ext: '<path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>',
  refresh: '<polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/>',
  mail: '<rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 7l10 7 10-7"/>',
  msg: '<path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>',
  alert: '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>',
  check: '<polyline points="20 6 9 17 4 12"/>',
  back: '<polyline points="15 18 9 12 15 6"/>',
}
const svg = (k) => `<svg viewBox="0 0 24 24">${ICON[k]}</svg>`
const MARK = '<svg viewBox="0 0 24 24" fill="none"><rect x="5" y="3" width="14" height="18" rx="2.5" fill="#fff"/><path d="M8.5 12.5l2.4 2.4 4.6-5.2" stroke="#4338CA" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>'

// ── API ───────────────────────────────────────────────────────────────────────
async function api(method, path, body) {
  const r = await fetch('/api/admin' + path, { method, credentials: 'include', headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined })
  const d = await r.json().catch(() => ({ error: `HTTP ${r.status}` }))
  if (!r.ok) { if (r.status === 401 && S.auth) { S.auth = null; render() } throw new Error(d.error || 'Request failed') }
  return d
}

// ── Auth ──────────────────────────────────────────────────────────────────────
async function checkAuth() {
  try { S.auth = await api('GET', '/me'); await go(location.hash.slice(1) || 'overview') }
  catch { S.auth = null; render() }
}
async function login() {
  S.login.loading = true; S.login.err = ''; render()
  try { await api('POST', '/login', { email: S.login.email, password: S.login.password }); S.auth = await api('GET', '/me'); await go('overview') }
  catch (e) { S.login.err = e.message; S.login.loading = false; render() }
}
async function logout() { await api('POST', '/logout').catch(() => {}); S.auth = null; render() }

// ── Navigation ────────────────────────────────────────────────────────────────
const PAGES = {
  overview:   ['Overview', 'How CVMaster is doing'],
  inbox:      ['Inbox', 'Emails to support@cvmaster.live and messages from the site'],
  users:      ['Users', 'Accounts, credits and referrals'],
  reviews:    ['Reviews', 'Ratings from people who made a CV — approve comments for the homepage'],
  newsletter: ['Newsletter', 'Write and send an email to your users'],
  settings:   ['Settings', 'Maintenance mode and setup status'],
}
async function go(p) {
  if (!PAGES[p]) p = 'overview'
  S.page = p
  if (location.hash.slice(1) !== p) history.replaceState(null, '', '#' + p)
  render()
  if (p === 'overview') await loadStats()
  if (p === 'inbox') await loadInbox()
  if (p === 'users' && !S.users.length) await loadUsers(1)
  if (p === 'reviews') await loadReviews()
  if (p === 'settings') await Promise.all([loadConfig(), S.stats ? null : loadStats()])
  if (p === 'overview' || !S.stats) loadCounts()
}
// Unread emails + open site messages for the nav badge
async function loadCounts() {
  try { const d = await api('GET', '/stats'); S.stats = d; S.maintenance = !!d.maintenance; render() } catch {}
  try { S.rv = await api('GET', '/reviews'); render() } catch {}
}

// ── Overview ──────────────────────────────────────────────────────────────────
async function loadStats() {
  S.statsLoading = !S.stats; render()
  try { const d = await api('GET', '/stats'); S.stats = d; S.maintenance = !!d.maintenance } catch (e) { toast(e.message) }
  S.statsLoading = false; render()
}
async function toggleMaintenance() {
  const on = !S.maintenance
  if (on && !confirm('Turn on maintenance mode? The site will show a “back soon” page to everyone.')) { render(); return }
  S.maintLoading = true; render()
  try { const d = await api('POST', '/maintenance', { enabled: on }); S.maintenance = !!d.maintenance; toast(S.maintenance ? 'Maintenance mode is ON' : 'Site is live again') } catch (e) { toast(e.message) }
  S.maintLoading = false; render()
}
const PRODUCT = { email_export: 'Clean CV', ai_pack: 'AI pack', clean_download: 'Clean download' }
const PRICE = { email_export: 99, ai_pack: 50, clean_download: 50 }

function renderOverview() {
  if (S.statsLoading || !S.stats) return `<div class="loading"><div class="spinner"></div></div>`
  const s = S.stats
  const daily = s.daily || []
  const max = Math.max(1, ...daily.map(d => Math.max(d.signups, d.payments)))
  const inboxN = (s.inbox_unread || 0), fbN = (s.feedback_open || 0)
  return `
  <div class="kpis">
    <div class="card kpi"><div class="kpi-l">Revenue</div><div class="kpi-v">${eur(s.revenue_eur_cents)}</div><div class="kpi-s">from real Stripe payments</div></div>
    <div class="card kpi"><div class="kpi-l">Payments</div><div class="kpi-v">${fmt(s.payments?.total)}</div><div class="kpi-s"><b>+${fmt(s.payments?.week)}</b> this week</div></div>
    <div class="card kpi"><div class="kpi-l">Users</div><div class="kpi-v">${fmt(s.users?.total)}</div><div class="kpi-s"><b>+${fmt(s.users?.week)}</b> this week · ${fmt(s.referrals?.total)} via referrals</div></div>
    <div class="card kpi"><div class="kpi-l">AI requests today</div><div class="kpi-v">${fmt(s.ai_requests_today)}</div><div class="kpi-s">${fmt(s.drafts?.total)} CVs created in total</div></div>
  </div>
  <div class="ov-grid">
    <div class="card">
      <div class="card-hd"><h3>Last 14 days</h3><div class="legend"><span><i style="background:#C7D2FE"></i>Sign-ups</span><span><i style="background:var(--ac)"></i>Payments</span></div></div>
      <div class="card-bd"><div class="chart">
        ${daily.map(d => `<div class="bar-col" title="${fmtDate(d.day)} — ${d.signups} sign-ups, ${d.payments} payments">
          <div class="bars"><div class="bar s" style="height:${d.signups / max * 100}%"></div><div class="bar p" style="height:${d.payments / max * 100}%"></div></div>
          <div class="bar-x">${new Date(d.day).getDate()}</div></div>`).join('')}
      </div></div>
    </div>
    <div class="card attn">
      <div class="card-hd"><h3>Needs attention</h3></div>
      <button class="attn-row" data-go="inbox" data-tab="email"><span class="attn-ic" style="background:var(--ac-lt);color:var(--ac)">${svg('mail')}</span>Unread emails<span class="n">${inboxN}</span></button>
      <button class="attn-row" data-go="inbox" data-tab="site"><span class="attn-ic" style="background:var(--amber-lt);color:var(--amber)">${svg('msg')}</span>Open site messages<span class="n">${fbN}</span></button>
      <button class="attn-row" data-go="settings"><span class="attn-ic" style="background:${S.maintenance ? 'var(--red-lt);color:var(--red)' : 'var(--green-lt);color:var(--green)'}">${svg(S.maintenance ? 'alert' : 'check')}</span>${S.maintenance ? 'Maintenance mode is ON' : 'Site is live'}<span class="n"></span></button>
    </div>
  </div>
  <div class="card">
    <div class="card-hd"><h3>Recent payments</h3></div>
    ${!s.recent_payments?.length ? `<div class="empty"><strong>No payments yet</strong>They'll appear here as people buy.</div>` : s.recent_payments.map(p => `
      <div class="pay-row"><div class="av">${esc(initials(p.name || p.email))}</div>
        <div class="pay-who"><div>${esc(p.name || p.email)}</div><div class="muted" style="font-size:12px">${esc(p.email)} · ${fmtDate(p.created_at)}</div></div>
        <span class="badge ${p.source === 'stripe' ? 'b-ac' : 'b-gray'}">${esc(PRODUCT[p.product] || p.product)}${p.source !== 'stripe' ? ' · ' + esc(p.source) : ''}</span>
        <div class="pay-amt">${p.source === 'stripe' ? eur(PRICE[p.product] || 0) : '—'}</div></div>`).join('')}
  </div>`
}

// ── Inbox ─────────────────────────────────────────────────────────────────────
const KIND = { suggestion: ['Suggestion', 'b-gray'], problem: ['Problem', 'b-sky'], payment: ['Payment', 'b-amber'], complaint: ['Complaint', 'b-red'] }
async function loadInbox() {
  const I = S.inbox
  I.loading = true; render()
  try {
    const [e, f] = await Promise.all([
      api('GET', '/inbox' + (I.status === 'all' ? '' : '?status=' + (I.status === 'open' ? 'open' : 'done'))),
      api('GET', '/feedback' + (I.status === 'all' ? '' : '?status=' + (I.status === 'open' ? 'open' : 'resolved'))),
    ])
    I.emails = e.items.map(m => ({ ...m, _k: 'email', _t: m.received_at }))
    I.site = f.items.map(m => ({ ...m, _k: 'site', _t: m.created_at }))
    I.unread = e.unread; I.open = f.open
  } catch (err) { toast(err.message) }
  I.loading = false; render()
}
function inboxItems() {
  const I = S.inbox
  const list = I.tab === 'email' ? I.emails : I.tab === 'site' ? I.site : [...I.emails, ...I.site]
  return list.slice().sort((a, b) => new Date(b._t) - new Date(a._t))
}
async function openItem(kind, id) {
  const I = S.inbox
  I.sel = { kind, id }; I.reply = ''; I.err = ''; I.detail = null; I.detailLoading = true; render()
  try {
    if (kind === 'email') {
      I.detail = { ...(await api('GET', '/inbox/' + id)), _k: 'email' }
      const row = I.emails.find(m => m.id === id); if (row && !row.read) { row.read = true; I.unread = Math.max(0, I.unread - 1) }
    } else {
      const m = I.site.find(x => x.id === id)
      const r = await api('GET', `/feedback/${id}/replies`)
      I.detail = { ...m, replies: r.replies, _k: 'site' }
    }
  } catch (e) { I.err = e.message }
  I.detailLoading = false; render()
  const f = $('ib-frame'); if (f && I.detail?.html_body) f.srcdoc = I.detail.html_body
}
async function sendReply() {
  const I = S.inbox, d = I.detail
  const body = ($('ib-reply')?.value || '').trim()
  if (!body) return
  I.sending = true; I.err = ''; I.reply = body; render()
  try {
    const r = await api('POST', d._k === 'email' ? `/inbox/${d.id}/reply` : `/feedback/${d.id}/reply`, { body })
    toast('Reply sent to ' + r.sentTo)
    I.reply = ''
    await loadInbox(); await openItem(d._k, d.id)
  } catch (e) { I.err = e.message }
  I.sending = false; render()
}
async function setItemStatus(done) {
  const d = S.inbox.detail
  try {
    if (d._k === 'email') await api('PATCH', '/inbox/' + d.id, { status: done ? 'done' : 'open' })
    else await api('PATCH', '/feedback/' + d.id, { status: done ? 'resolved' : 'open' })
    toast(done ? 'Marked as done' : 'Moved back to open')
    await loadInbox(); await openItem(d._k, d.id)
  } catch (e) { toast(e.message) }
}
async function deleteItem() {
  const d = S.inbox.detail
  if (!confirm('Delete this email permanently?')) return
  try { await api('DELETE', '/inbox/' + d.id); S.inbox.sel = null; S.inbox.detail = null; toast('Deleted'); await loadInbox() } catch (e) { toast(e.message) }
}

function renderInbox() {
  const I = S.inbox
  const items = inboxItems()
  const tab = (id, label, n) => `<button class="${I.tab === id ? 'on' : ''}" data-ibtab="${id}">${label}${n ? ` (${n})` : ''}</button>`
  const list = I.loading && !items.length ? `<div class="loading"><div class="spinner"></div></div>`
    : !items.length ? `<div class="empty"><strong>Nothing here</strong>${I.status === 'open' ? 'You’re all caught up.' : 'No messages yet.'}</div>`
    : items.map(m => {
      const on = I.sel && I.sel.id === m.id
      if (m._k === 'email') return `<button class="ib-item ${on ? 'on' : ''} ${!m.read ? 'unread' : ''} ${m.status === 'done' ? 'done' : ''}" data-open="email:${m.id}">
        <div class="av">${esc(initials(m.from_name || m.from_addr))}</div>
        <div class="ib-body"><div class="ib-l1"><span class="ib-from">${esc(m.from_name || m.from_addr)}</span>${!m.read ? '<span class="ib-dot"></span>' : ''}<span class="ib-time">${ago(m.received_at)}</span></div>
          <div class="ib-subj">${esc(m.subject || '(no subject)')}</div><div class="ib-snip">${esc(m.preview || '')}</div>
          <div class="ib-l3"><span class="badge b-ac">Email</span>${m.reply_count ? `<span class="badge b-green">Replied</span>` : ''}${m.attachment_count ? `<span class="badge b-gray">${m.attachment_count} attachment${m.attachment_count > 1 ? 's' : ''}</span>` : ''}</div></div></button>`
      const k = KIND[m.kind] || KIND.suggestion
      return `<button class="ib-item ${on ? 'on' : ''} ${m.status === 'open' ? 'unread' : 'done'}" data-open="site:${m.id}">
        <div class="av" style="background:var(--s2);color:var(--t2)">${esc(initials(m.email || 'G'))}</div>
        <div class="ib-body"><div class="ib-l1"><span class="ib-from">${esc(m.email || 'Guest (no email)')}</span><span class="ib-time">${ago(m.created_at)}</span></div>
          <div class="ib-subj">${esc(k[0])} · #${m.id.slice(0, 8).toUpperCase()}</div><div class="ib-snip">${esc(m.message)}</div>
          <div class="ib-l3"><span class="badge ${k[1]}">${k[0]}</span><span class="badge b-gray">Site message</span></div></div></button>`
    }).join('')

  return `<div class="ib ${I.sel ? 'has-sel' : ''}">
    <div class="ib-list">
      <div class="ib-tools">
        <div class="seg" style="width:100%">${tab('all', 'All')}${tab('email', 'Emails', I.unread)}${tab('site', 'Site messages', I.open)}</div>
        <div class="row"><div class="seg">${['open', 'done', 'all'].map(s => `<button class="${I.status === s ? 'on' : ''}" data-ibstatus="${s}">${s[0].toUpperCase() + s.slice(1)}</button>`).join('')}</div>
          <button class="btn btn-sm btn-ghost" data-act="inbox-refresh">${svg('refresh')}</button></div>
      </div>
      <div class="ib-items">${list}</div>
    </div>
    <div class="ib-view">${renderDetail()}</div>
  </div>`
}

function renderDetail() {
  const I = S.inbox, d = I.detail
  if (!I.sel) return `<div class="ib-placeholder"><div>${svg('inbox').replace('<svg', '<svg style="width:40px;height:40px;fill:none;stroke:#C7C7DA;stroke-width:1.6;display:block;margin:0 auto 10px"')}Choose a message to read it</div></div>`
  if (I.detailLoading || !d) return `<div class="loading"><div class="spinner"></div></div>`
  const back = `<button class="btn btn-sm ib-back" data-act="inbox-back">${svg('back')} Back</button>`
  const replies = (d.replies || []).map(r => `<div class="reply-sent"><div class="hd">You replied to ${esc(r.sent_to)} · ${fmtDate(r.sent_at)} ${new Date(r.sent_at).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })}</div>${esc(r.body)}</div>`).join('')
  const canReply = d._k === 'email' || !!d.email
  const done = d._k === 'email' ? d.status === 'done' : d.status === 'resolved'
  const actions = `<div class="ib-actions">
    <button class="btn btn-sm" data-act="${done ? 'reopen' : 'done'}">${svg('check')} ${done ? 'Reopen' : 'Mark done'}</button>
    ${d._k === 'email' ? `<button class="btn btn-sm btn-danger" data-act="delete">Delete</button>` : ''}</div>`
  const composer = canReply ? `<div class="composer">
      <textarea id="ib-reply" class="inp" rows="6" placeholder="Write your reply…">${esc(I.reply)}</textarea>
      ${I.err ? `<div class="alert alert-err" style="margin:10px 0 0">${esc(I.err)}</div>` : ''}
      <div class="row"><span class="from">From <b>support@cvmaster.live</b> to ${esc(d._k === 'email' ? d.from_addr : d.email)}</span>
        <button class="btn btn-primary" data-act="reply" ${I.sending ? 'disabled' : ''}>${I.sending ? 'Sending…' : 'Send reply'}</button></div>
    </div>` : `<p class="ib-note">This person didn’t leave an email address, so you can’t reply.</p>`

  if (d._k === 'email') return `<div class="ib-msg">${back}
    <div class="ib-subject">${esc(d.subject || '(no subject)')}</div>
    <div class="ib-meta"><div class="av">${esc(initials(d.from_name || d.from_addr))}</div>
      <div class="who"><b>${esc(d.from_name || d.from_addr)}</b><span>${esc(d.from_addr)} · to ${esc(d.to_addrs || 'support')} · ${fmtDate(d.received_at)} ${new Date(d.received_at).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })}</span></div>${actions}</div>
    ${d.html_body ? `<iframe id="ib-frame" class="ib-frame" sandbox="" title="Email"></iframe><p class="ib-note">Shown safely: scripts and remote images are blocked.</p>`
      : `<div class="ib-content">${esc(d.text_body || '(This email has no text content.)')}</div>`}
    ${(d.attachments || []).length ? `<div class="ib-atts">${d.attachments.map(a => `<span class="badge b-gray">📎 ${esc(a.filename || 'attachment')}</span>`).join('')}</div><p class="ib-note">Attachments are kept in Resend (Emails → Receiving).</p>` : ''}
    <div class="thread">${replies}</div>${composer}</div>`

  const k = KIND[d.kind] || KIND.suggestion
  return `<div class="ib-msg">${back}
    <div class="ib-subject">${esc(k[0])} <span class="muted" style="font-weight:600;font-size:15px">#${d.id.slice(0, 8).toUpperCase()}</span></div>
    <div class="ib-meta"><div class="av" style="background:var(--s2);color:var(--t2)">${esc(initials(d.email || 'G'))}</div>
      <div class="who"><b>${esc(d.email || 'Guest — no email')}</b><span>${d.signed_in ? 'Signed-in user' : 'Guest'} · ${fmtDate(d.created_at)}${d.page ? ' · sent from ' + esc(d.page) : ''}</span></div>${actions}</div>
    <div class="ib-content">${esc(d.message)}</div>
    <div class="thread">${replies}</div>${composer}</div>`
}

// ── Users ─────────────────────────────────────────────────────────────────────
async function loadUsers(page = 1) {
  S.usersLoading = true; S.userPage = page; render()
  try { const q = new URLSearchParams({ page, search: S.uSearch }); const d = await api('GET', '/users?' + q); S.users = d.users; S.userTotal = d.total; S.userPages = Math.max(1, d.pages) } catch (e) { toast(e.message) }
  S.usersLoading = false; render()
}
async function editCount(id, field, label, cur) {
  const v = prompt(`${label}\nCurrent: ${cur}\nNew amount:`, cur)
  if (v === null) return
  const n = parseInt(v, 10)
  if (isNaN(n) || n < 0) { alert('Enter a whole number (0 or more).'); return }
  try { await api('PATCH', `/users/${id}`, { [field]: n }); toast('Updated'); await loadUsers(S.userPage) } catch (e) { toast(e.message) }
}
async function deleteUser(id, email) {
  if (!confirm(`Delete ${email} and all their CVs permanently? This can’t be undone.`)) return
  try { await api('DELETE', `/users/${id}`); toast('User deleted'); await loadUsers(S.userPage) } catch (e) { toast(e.message) }
}

    <table class="tbl"><thead><tr><th>User</th><th>Sign-in</th><th>CVs</th><th>Paid</th><th>Free CVs</th><th>AI credits</th><th>Referred</th><th>Joined</th><th></th></tr></thead>

const BLOCK_DEFS = {
  heading:   { label:'Heading',      icon:'H',   defaults:{ text:'Your heading here', align:'left', size:28, color:'#1a1a1a', bold:true, italic:false } },
  subheading:{ label:'Subheading',   icon:'h2',  defaults:{ text:'Subheading text', align:'left', size:18, color:'#444444', bold:true } },
  text:      { label:'Text',         icon:'¶',   defaults:{ text:'Your paragraph text here.', align:'left', size:15, color:'#333333', lineHeight:1.7 } },
  button:    { label:'Button',       icon:'▶',   defaults:{ text:'Click here', url:'https://', align:'center', bgColor:'#1a1a1a', textColor:'#ffffff', radius:8, size:'md' } },
  image:     { label:'Image',        icon:'IMG', defaults:{ url:'', alt:'', align:'center', width:100, radius:0, link:'' } },
  hero:      { label:'Hero Banner',  icon:'★',   defaults:{ title:'Big headline here', subtitle:'Supporting text goes here', bgColor:'#1a1a2e', textColor:'#ffffff', btnText:'Get started', btnUrl:'https://', btnColor:'#4338CA' } },
  divider:   { label:'Divider',      icon:'—',   defaults:{ color:'#e5e5e5', thickness:1, style:'solid' } },
  spacer:    { label:'Spacer',       icon:'↕',   defaults:{ height:32 } },
  columns:   { label:'2 Columns',    icon:'⊞',  defaults:{ col1:'**Left column**\n\nYour left content here.', col2:'**Right column**\n\nYour right content here.' } },
  quote:     { label:'Quote',        icon:'"',   defaults:{ text:'Inspiring quote goes here.', author:'', color:'#4338CA', bgColor:'#f0f4ff' } },
  list:      { label:'Feature List', icon:'≡',   defaults:{ items:['First key point or feature','Second key point or feature','Third key point or feature'], color:'#4338CA' } },
  callout:   { label:'Callout Box',  icon:'!',   defaults:{ text:'Important message or highlight here.', bgColor:'#fff8e1', borderColor:'#f59e0b', icon:'⚡' } },
  social:    { label:'Social Links', icon:'@',   defaults:{ links:[{name:'Twitter',url:'https://twitter.com/',emoji:'𝕏'},{name:'LinkedIn',url:'https://linkedin.com/',emoji:'in'},{name:'Instagram',url:'https://instagram.com/',emoji:'IG'}] } },
  footer:    { label:'Footer Text',  icon:'ft',  defaults:{ text:'© CVMaster · cvmaster.live', color:'#999999', size:12 } },
  html:      { label:'Raw HTML',     icon:'</>',  defaults:{ code:'<p style="color:#333;font-family:Arial,sans-serif">Custom HTML here</p>' } },
};

function addBlock(type) {
  const def = BLOCK_DEFS[type];
  if(!def) return;
  S.blocks.push({ id:uid(), type, ...JSON.parse(JSON.stringify(def.defaults)) });
  render(); refreshPreview();
}
function removeBlock(id) { S.blocks=S.blocks.filter(b=>b.id!==id); render(); refreshPreview(); }
function moveBlock(id,dir) {
  const i=S.blocks.findIndex(b=>b.id===id);
  if(dir===-1&&i>0){[S.blocks[i-1],S.blocks[i]]=[S.blocks[i],S.blocks[i-1]];}
  if(dir===1&&i<S.blocks.length-1){[S.blocks[i],S.blocks[i+1]]=[S.blocks[i+1],S.blocks[i]];}
  render(); refreshPreview();
}
function updateBlock(id,field,value,subIdx) {
  const b=S.blocks.find(b=>b.id===id); if(!b) return;
  if(subIdx!==undefined&&Array.isArray(b.links)){b.links[subIdx][field]=value;}
  else b[field]=value;
  refreshPreview();
}

// ── HTML GENERATION ───────────────────────────────────────────────────────────
function simpleMarkdown(text) {
  // Support **bold** and *italic* in text blocks
  return (text||'')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,'<em>$1</em>')
    .replace(/\n/g,'<br>');
}

function blockToHtml(b) {
  if(b.type==='heading'){
    const fw=b.bold!==false?'700':'400';
    const fs=b.italic?'italic':'normal';
    return `<h1 style="font-family:Georgia,serif;font-size:${b.size||28}px;font-weight:${fw};font-style:${fs};color:${b.color||'#1a1a1a'};margin:0 0 16px;text-align:${b.align||'left'};line-height:1.25;letter-spacing:-0.01em">${esc(b.text||'')}</h1>`;
  }
  if(b.type==='subheading'){
    return `<h2 style="font-family:Arial,sans-serif;font-size:${b.size||18}px;font-weight:${b.bold?'700':'500'};color:${b.color||'#444'};margin:0 0 12px;text-align:${b.align||'left'};line-height:1.35">${esc(b.text||'')}</h2>`;
  }
  if(b.type==='text'){
    return `<p style="font-family:Arial,sans-serif;font-size:${b.size||15}px;color:${b.color||'#333'};line-height:${b.lineHeight||1.7};margin:0 0 14px;text-align:${b.align||'left'}">${simpleMarkdown(b.text)}</p>`;
  }
  if(b.type==='button'){
    const pad=b.size==='lg'?'15px 36px':b.size==='sm'?'8px 18px':'12px 28px';
    const fsize=b.size==='lg'?'17px':b.size==='sm'?'13px':'15px';
    return `<table width="100%" cellpadding="0" cellspacing="0" style="margin:8px 0"><tr><td align="${b.align||'center'}" style="padding:12px 0">
<a href="${esc(b.url||'#')}" style="display:inline-block;background:${b.bgColor||'#1a1a1a'};color:${b.textColor||'#fff'};font-family:Arial,sans-serif;font-size:${fsize};font-weight:700;padding:${pad};border-radius:${b.radius||8}px;text-decoration:none;letter-spacing:.01em">${esc(b.text||'Click here')}</a>
</td></tr></table>`;
  }
  if(b.type==='image'){
    const w=b.width&&b.width<100?`width="${b.width}%" `:'style="max-width:100%;" ';
    const img=`<img src="${esc(b.url||'')}" alt="${esc(b.alt||'')}" ${w}style="border-radius:${b.radius||0}px;display:block" />`;
    const wrapped=b.link?`<a href="${esc(b.link)}" style="display:block">${img}</a>`:img;
    return `<div style="text-align:${b.align||'center'};margin:16px 0">${wrapped}</div>`;
  }
  if(b.type==='hero'){
    return `<table width="100%" cellpadding="0" cellspacing="0" style="margin:0 -40px;width:calc(100% + 80px)">
<tr><td style="background:${b.bgColor||'#1a1a2e'};padding:48px 40px;text-align:center">
<h1 style="font-family:Georgia,serif;font-size:32px;font-weight:700;color:${b.textColor||'#fff'};margin:0 0 14px;line-height:1.2">${esc(b.title||'')}</h1>
<p style="font-family:Arial,sans-serif;font-size:16px;color:${b.textColor||'#fff'};opacity:.75;margin:0 0 28px;line-height:1.6">${esc(b.subtitle||'')}</p>
<a href="${esc(b.btnUrl||'#')}" style="display:inline-block;background:${b.btnColor||'#4338CA'};color:#fff;font-family:Arial,sans-serif;font-size:15px;font-weight:700;padding:13px 32px;border-radius:8px;text-decoration:none">${esc(b.btnText||'Get started')}</a>
</td></tr></table>`;
  }
  if(b.type==='divider'){
    const s=b.style||'solid';
    return `<hr style="border:none;border-top:${b.thickness||1}px ${s} ${b.color||'#e5e5e5'};margin:24px 0" />`;
  }
  if(b.type==='spacer'){
    return `<div style="height:${b.height||32}px;line-height:${b.height||32}px;font-size:1px">&nbsp;</div>`;
  }
  if(b.type==='columns'){
    return `<table width="100%" cellpadding="0" cellspacing="0" style="margin:8px 0"><tr>
<td width="50%" style="vertical-align:top;padding-right:14px;font-family:Arial,sans-serif;font-size:14px;color:#333;line-height:1.65">${simpleMarkdown(b.col1)}</td>
<td width="50%" style="vertical-align:top;padding-left:14px;font-family:Arial,sans-serif;font-size:14px;color:#333;line-height:1.65">${simpleMarkdown(b.col2)}</td>
</tr></table>`;
  }
  if(b.type==='quote'){
    return `<table width="100%" cellpadding="0" cellspacing="0" style="margin:16px 0"><tr>
<td style="background:${b.bgColor||'#f0f4ff'};border-left:4px solid ${b.color||'#4338CA'};padding:18px 22px;border-radius:0 8px 8px 0">
<p style="font-family:Georgia,serif;font-size:17px;font-style:italic;color:#333;margin:0 0 ${b.author?'10px':'0'};line-height:1.6">&ldquo;${esc(b.text||'')}&rdquo;</p>
${b.author?`<cite style="font-family:Arial,sans-serif;font-size:13px;color:#888;font-style:normal;font-weight:600">&#8212; ${esc(b.author)}</cite>`:''}
</td></tr></table>`;
  }
  if(b.type==='list'){
    const items=(b.items||[]).map(item=>`
<tr><td style="padding:6px 0;vertical-align:top">
<table cellpadding="0" cellspacing="0"><tr>
<td style="width:24px;padding-right:10px;color:${b.color||'#4338CA'};font-weight:700;font-size:16px;vertical-align:top;line-height:1.5">✓</td>
<td style="font-family:Arial,sans-serif;font-size:15px;color:#333;line-height:1.6">${simpleMarkdown(item)}</td>
</tr></table>
</td></tr>`).join('');
    return `<table width="100%" cellpadding="0" cellspacing="0" style="margin:12px 0">${items}</table>`;
  }
  if(b.type==='callout'){
    return `<table width="100%" cellpadding="0" cellspacing="0" style="margin:16px 0"><tr>
<td style="background:${b.bgColor||'#fff8e1'};border:2px solid ${b.borderColor||'#f59e0b'};border-radius:10px;padding:16px 20px">
<p style="font-family:Arial,sans-serif;font-size:15px;color:#333;margin:0;line-height:1.65">
<span style="font-size:18px;margin-right:8px">${b.icon||'⚡'}</span>${simpleMarkdown(b.text)}
</p></td></tr></table>`;
  }
  if(b.type==='social'){
    const links=(b.links||[]).map(l=>`<a href="${esc(l.url||'#')}" style="display:inline-block;margin:0 6px;background:#f4f4f5;border-radius:6px;padding:8px 14px;text-decoration:none;font-family:Arial,sans-serif;font-size:13px;font-weight:600;color:#333">${esc(l.emoji||'')} ${esc(l.name||'')}</a>`).join('');
    return `<div style="text-align:center;padding:16px 0">${links}</div>`;
  }
  if(b.type==='footer'){
    return `<p style="font-family:Arial,sans-serif;font-size:${b.size||12}px;color:${b.color||'#999'};text-align:center;margin:8px 0;line-height:1.6">${simpleMarkdown(b.text)}</p>`;
  }
  if(b.type==='html'){
    return b.code||'';
  }
  return '';
}

// ── DRAG AND DROP ─────────────────────────────────────────────────────────────
function onDragStart(e, id) {
  S.dragSrc = id;
  e.currentTarget.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
}
function onDragEnd(e) {
  e.currentTarget.classList.remove('dragging');
  document.querySelectorAll('.drag-over').forEach(el=>el.classList.remove('drag-over'));
}
function onDragOver(e, id) {
  e.preventDefault(); e.dataTransfer.dropEffect='move';
  document.querySelectorAll('.drag-over').forEach(el=>el.classList.remove('drag-over'));
  if(id !== S.dragSrc) e.currentTarget.closest('.block-wrap')?.classList.add('drag-over');
}
function onDrop(e, targetId) {
  e.preventDefault();
  document.querySelectorAll('.drag-over').forEach(el=>el.classList.remove('drag-over'));
  if(!S.dragSrc||S.dragSrc===targetId) return;
  const from=S.blocks.findIndex(b=>b.id===S.dragSrc);
  const to=S.blocks.findIndex(b=>b.id===targetId);
  if(from<0||to<0) return;
  const [moved]=S.blocks.splice(from,1);
  S.blocks.splice(to,0,moved);
  S.dragSrc=null;
  render(); refreshPreview();
}

// ── SEND ──────────────────────────────────────────────────────────────────────
async function sendEmail(test=false) {
  const subject=$('e-subject')?.value||S.email.subject;
  const plan=$('e-plan-sel')?.value||S.email.plan;
  const testTo=$('e-test')?.value||S.email.testTo;
  if(!subject){alert('Please add a subject line.');return;}
  if(S.blocks.length===0){alert('Please add at least one content block.');return;}
  S.email.subject=subject; S.email.plan=plan;
  S.email.sending=true; S.email.err=''; S.email.sent=false; render();
  try {
    const payload={subject,body:buildEmailHtml(),plan_filter:plan};
    if(test&&testTo) payload.test_email=testTo;
    const d=await api('POST','/email/send',payload);
    S.email.sent=true; S.email.sentCount=d.sent;
  } catch(e){ S.email.err=e.message; }
  S.email.sending=false; render();
}

  $('ib-reply')?.addEventListener('input', e => { S.inbox.reply = e.target.value })

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-go],[data-act],[data-open],[data-ibtab],[data-ibstatus],[data-edit],[data-del],[data-page],[data-review]')
  if (!t) return
  if (t.dataset.review) { setReview(t.dataset.review, t.dataset.st); return }
  if (t.dataset.go) { if (t.dataset.tab) S.inbox.tab = t.dataset.tab; go(t.dataset.go); return }
  if (t.dataset.open) { const [k, id] = t.dataset.open.split(':'); openItem(k, id); return }
  if (t.dataset.ibtab) { S.inbox.tab = t.dataset.ibtab; render(); return }
  if (t.dataset.ibstatus) { S.inbox.status = t.dataset.ibstatus; S.inbox.sel = null; S.inbox.detail = null; loadInbox(); return }
  if (t.dataset.edit) { editCount(t.dataset.id, t.dataset.edit, t.dataset.label, t.dataset.cur); return }
  if (t.dataset.del) { deleteUser(t.dataset.del, t.dataset.email); return }
  if (t.dataset.page) { loadUsers(Number(t.dataset.page)); return }
  const a = t.dataset.act
  if (a === 'logout') logout()
  else if (a === 'stats-refresh') { S.stats = null; loadStats() }
  else if (a === 'config-refresh') { S.config = null; render(); loadConfig() }
  else if (a === 'inbox-refresh') loadInbox()
  else if (a === 'inbox-back') { S.inbox.sel = null; S.inbox.detail = null; render() }
  else if (a === 'reply') sendReply()
  else if (a === 'done') setItemStatus(true)
  else if (a === 'reopen') setItemStatus(false)
  else if (a === 'delete') deleteItem()
})
document.addEventListener('submit', (e) => {
  const f = e.target.dataset.form
  if (!f) return
  e.preventDefault()
  if (f === 'login') { S.login.email = $('li-email').value; S.login.password = $('li-pass').value; login() }
  if (f === 'user-search') { S.uSearch = $('u-q').value.trim(); loadUsers(1) }
})
window.addEventListener('hashchange', () => { const p = location.hash.slice(1); if (S.auth && p && p !== S.page) go(p) })

// Newsletter builder handlers (inline onclick in its markup)
window.addBlock = addBlock; window.removeBlock = removeBlock; window.moveBlock = moveBlock
window.updateBlock = updateBlock; window.loadTemplate = loadTemplate; window.clearBlocks = clearBlocks
window.copyHtml = copyHtml; window.onDragStart = onDragStart; window.onDragEnd = onDragEnd
window.onDragOver = onDragOver; window.onDrop = onDrop

checkAuth()
</script>
</body>
</html>
