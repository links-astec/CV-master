async function loadTemplate(key) {
  const saved = (S.myTemplates || []).find(x => 'my:' + x.id === key)
  const tpl = saved ? { name: saved.name, subject: saved.subject, audience: saved.audience, blocks: () => saved.blocks.map(b => ({ ...b, id: uid() })) } : BUILTIN[key]
  if (!tpl) return
  if (S.blocks.length && !(await ask({ title: `Use “${tpl.name}”?`, message: 'This replaces the email you’re working on.', ok: 'Use template' }))) { render(); return }
  S.blocks = tpl.blocks()
  S.email.subject = tpl.subject || S.email.subject
  S.email.plan = tpl.audience || 'all'
  S.email.important = false
  S.tplCurrent = saved ? { id: saved.id, name: saved.name } : null
  render(); refreshPreview()
}
async function loadMyTemplates() {
  try { S.myTemplates = (await api('GET', '/email/templates')).items; render() } catch { S.myTemplates = [] }
}
async function saveTemplate(update) {
  if (!S.blocks.length) { toast('Add some content first.'); return }
  const subject = $('e-subject')?.value || S.email.subject
  const plan = $('e-plan-sel')?.value || S.email.plan
  const name = update ? S.tplCurrent.name : await askText({ title: 'Save as template', message: 'Give it a name you’ll recognise.', value: subject || 'My template' })
  if (!name || !name.trim()) return
  const payload = { name: name.trim(), subject, audience: plan, blocks: S.blocks }
  try {
    const row = update ? await api('PUT', '/email/templates/' + S.tplCurrent.id, payload) : await api('POST', '/email/templates', payload)
    S.tplCurrent = { id: row.id, name: row.name }
    toast(update ? 'Template updated' : `Saved as “${row.name}”`)
    await loadMyTemplates()
  } catch (e) { toast(e.message) }
}
async function deleteTemplate() {
  if (!S.tplCurrent || !(await ask({ title: `Delete “${S.tplCurrent.name}”?`, message: 'Emails already sent aren’t affected.', ok: 'Delete', danger: true }))) return
  try { await api('DELETE', '/email/templates/' + S.tplCurrent.id); S.tplCurrent = null; toast('Template deleted'); await loadMyTemplates() } catch (e) { toast(e.message) }
}

function nlField(e) {
  const t = e.target.closest?.('[data-bf]'); if (!t) return
  const v = t.dataset.bchk ? t.checked : t.dataset.blines ? t.value.split('\n').filter(x => x.trim()) : t.value
  updateBlock(Number(t.dataset.bid), t.dataset.bf, v, t.dataset.bidx !== undefined ? Number(t.dataset.bidx) : undefined)
}
document.addEventListener('input', nlField)
document.addEventListener('change', (e) => { if (e.target.matches?.('select[data-bf],input[type=checkbox][data-bf],input[type=color][data-bf]')) nlField(e) })
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-nl]'); if (!t || t.disabled) return
  const a = t.dataset.nl
  if (a === 'add') addBlock(t.dataset.type)
  else if (a === 'tpl') loadTemplate(t.dataset.t)
  else if (a === 'clear') clearBlocks()
  else if (a === 'move') moveBlock(Number(t.dataset.bid), Number(t.dataset.dir))
  else if (a === 'remove') removeBlock(Number(t.dataset.bid))
  else if (a === 'copy') copyHtml()
  else if (a === 'save-tpl') saveTemplate(false)
  else if (a === 'update-tpl') saveTemplate(true)
  else if (a === 'delete-tpl') deleteTemplate()
})
const blockOf = (e) => e.target.closest?.('.block-wrap[data-id]')
document.addEventListener('dragstart', (e) => { const w = blockOf(e); if (w) onDragStart(e, Number(w.dataset.id)) })
document.addEventListener('dragend',   (e) => { if (blockOf(e)) onDragEnd(e) })
document.addEventListener('dragover',  (e) => { const w = blockOf(e); if (w) onDragOver(e, Number(w.dataset.id)) })
document.addEventListener('drop',      (e) => { const w = blockOf(e); if (w) onDrop(e, Number(w.dataset.id)) })

function onDragStart(e, id) {
  S.dragSrc = id;
  e.currentTarget.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
}
function onDragEnd(e) {
  e.currentTarget.classList.remove('dragging');
  document.querySelectorAll('.drag-over').forEach(el=>el.classList.remove('drag-over'));
}
function onDragOver(e, id) {
  e.preventDefault(); e.dataTransfer.dropEffect='move';
  document.querySelectorAll('.drag-over').forEach(el=>el.classList.remove('drag-over'));
  if(id !== S.dragSrc) e.currentTarget.closest('.block-wrap')?.classList.add('drag-over');
}
function onDrop(e, targetId) {
  e.preventDefault();
  document.querySelectorAll('.drag-over').forEach(el=>el.classList.remove('drag-over'));
  if(!S.dragSrc||S.dragSrc===targetId) return;
  const from=S.blocks.findIndex(b=>b.id===S.dragSrc);
  const to=S.blocks.findIndex(b=>b.id===targetId);
  if(from<0||to<0) return;
  const [moved]=S.blocks.splice(from,1);
  S.blocks.splice(to,0,moved);
  S.dragSrc=null;
  render(); refreshPreview();
}

async function sendEmail(test=false) {
  const subject=$('e-subject')?.value||S.email.subject;
  const plan=$('e-plan-sel')?.value||S.email.plan;
  const testTo=$('e-test')?.value||S.email.testTo;
  if (!subject) { toast('Add a subject line first.'); return; }
  if (S.blocks.length === 0) { toast('Add at least one content block first.'); return; }
  S.email.subject=subject; S.email.plan=plan;
  S.email.sending=true; S.email.err=''; S.email.sent=false; render();
  try {
    const toUsers=plan==='users', toPeople=plan==='people';
    if(toPeople&&!test&&!S.email.people.length){ throw new Error('Add at least one person to send to.') }
    const payload={subject,body:buildEmailHtml(),plan_filter:toUsers||toPeople?'all':plan,audience:toUsers?'all_users':toPeople?'people':'subscribers',important:toUsers&&S.email.important,recipients:toPeople?S.email.people:undefined};
    if(test&&testTo) payload.test_email=testTo;
    const d=await api('POST','/email/send',payload);
    S.email.sent=true; S.email.sentCount=d.test?1:d.queued;
    if(!d.test){ loadHistory(); setTimeout(loadHistory, 8000) }
  } catch(e){ S.email.err=e.message; }
  S.email.sending=false; render();
}

    rows.push(`<div class="bi-row" style="margin-top:5px"><label class="bi-label">Icon</label><input class="bi" value="${esc(b.icon||'⚡')}" ${up('icon')} style="width:50px">${colPick('bgColor',b.bgColor||'#fff8e1','BG')}${colPick('borderColor',b.borderColor||'#f59e0b','Border')}</div>`);
  }
  if(type==='social'){
    rows.push(`<label class="bi-label">Social links</label>`);
    rows.push((b.links||[]).map((l,i)=>`<div class="bi-row" style="margin-top:5px"><input class="bi" value="${esc(l.emoji||'')}" placeholder="𝕏" data-bid="${id}" data-bf="emoji" data-bidx="${i}" style="width:44px"><input class="bi" value="${esc(l.name||'')}" placeholder="Name" data-bid="${id}" data-bf="name" data-bidx="${i}" style="flex:1"><input class="bi" value="${esc(l.url||'')}" placeholder="URL" data-bid="${id}" data-bf="url" data-bidx="${i}" style="flex:2"></div>`).join(''));
  }
  if(type==='footer'){
    rows.push(`<textarea class="bi" rows="2" placeholder="Footer text" ${up('text')}>${esc(b.text||'')}</textarea>`);
    rows.push(`<div class="bi-row" style="margin-top:5px">${colPick('color',b.color||'#999999','Color')}<label class="bi-label">Size</label><input type="number" class="bi" value="${b.size||12}" min="10" max="16" ${up('size')} style="width:55px"></div>`);
  }
  if(type==='html'){
    rows.push(`<label class="bi-label">Raw HTML (email-client safe)</label><textarea class="bi" rows="5" ${up('code')} style="font-family:monospace;font-size:12px;margin-top:3px">${esc(b.code||'')}</textarea>`);
  }
  return rows.join('\n');
}

// ── Render ────────────────────────────────────────────────────────────────────
function render() {
  const keepScroll = document.querySelector('.ib-items')?.scrollTop
  const newPage = S.auth && S.shownPage !== S.page; S.shownPage = S.auth ? S.page : null
  $('app').innerHTML = (!S.auth ? renderLogin() : renderApp()) + (S.toast ? `<div class="toast">${esc(S.toast)}</div>` : '')
  if (newPage) document.querySelector('.content')?.classList.add('enter')
  if (keepScroll) { const l = document.querySelector('.ib-items'); if (l) l.scrollTop = keepScroll }
  // Emails are shown with no scripts, and remote images only on request (tracking pixels)
  setEmailFrame()
  bind()
  // Phones: the nav is a sideways strip, keep the current page's tab in view
  document.querySelector('.sb-nav .nav.on')?.scrollIntoView({ block: 'nearest', inline: 'nearest' })
}

    <div class="login-sub">Admin, authorised access only</div>

    <form data-form="login">
      <div><label class="lbl" for="li-email">Email</label><input class="inp" id="li-email" type="email" value="${esc(S.login.email)}" autocomplete="username" required></div>

function renderApp() {
  const [title, sub] = PAGES[S.page]
  const inboxCount = (S.stats?.inbox_unread || 0) + (S.stats?.feedback_open || 0)
  const nav = [['overview', 'Overview'], ['inbox', 'Inbox', inboxCount], ['users', 'Users'], ['reviews', 'Reviews', S.rv?.pending], ['newsletter', 'Email'], ['subscribers', 'Subscribers'], ['blog', 'Blog'], ['app', 'App & activity'], ['settings', 'Settings']]
  const body = { overview: renderOverview, inbox: renderInbox, users: renderUsers, reviews: renderReviews, newsletter: renderEmail, subscribers: renderSubs, blog: renderBlog, app: renderAppPage, settings: renderSettings }[S.page]()
  return `<div class="app">
    <aside class="sb">
      <div class="sb-head"><span class="sb-logo">${LOGO_SIDEBAR}</span><span class="sb-tag">Admin</span></div>
      <nav class="sb-nav">${nav.map(([id, label, n]) => `<button class="nav ${S.page === id ? 'on' : ''}" data-go="${id}">${svg(id)}${label}${n ? `<span class="count">${n}</span>` : ''}</button>`).join('')}</nav>
      <div class="sb-foot"><div class="sb-av">${esc(initials(S.auth?.email))}</div><div class="sb-mail">${esc(S.auth?.email || '')}</div><button class="sb-out" data-act="logout" title="Sign out">${svg('out')}</button></div>
    </aside>
    <div class="main">
      <header class="top"><div><h1>${title}</h1><p>${sub}</p></div>
        <div class="top-r">${S.page === 'overview' ? `<button class="btn btn-sm" data-act="stats-refresh">${svg('refresh')}<span class="hide-sm"> Refresh</span></button>` : ''}
          <a class="btn btn-sm" href="https://www.cvmaster.live" target="_blank" rel="noopener">${svg('ext')} Open site</a></div></header>
      <div class="content ${S.page === 'inbox' ? 'flush' : ''}">${body}</div>
    </div>
    ${renderTabbar(nav)}
  </div>`
}

// Specific people for an email (from the field, or the Users page's "Email" button)
function addPeople(text, refocus = true) {
  const list = String(text).split(/[\s,;]+/).map(x => x.trim().toLowerCase()).filter(x => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(x))
  S.email.people = [...new Set([...S.email.people, ...list])].slice(0, 500)
  render()
  if (refocus) setTimeout(() => $('e-people')?.focus(), 0)
}

// Phones: bottom tabs for the main pages, the rest under "More"
const TABS = ['overview', 'inbox', 'users', 'newsletter']
function renderTabbar(nav) {
  const label = { overview: 'Overview', inbox: 'Inbox', users: 'Users', newsletter: 'Email' }
  const count = Object.fromEntries(nav.map(([id, , n]) => [id, n]))
  const inMore = !TABS.includes(S.page)
  const more = nav.filter(([id]) => !TABS.includes(id))
  return `<nav class="tabbar">
    ${TABS.map(id => `<button class="tab ${S.page === id ? 'on' : ''}" data-go="${id}">${svg(id)}${label[id]}${count[id] ? `<span class="dot">${count[id] > 99 ? '99+' : count[id]}</span>` : ''}</button>`).join('')}
    <button class="tab ${inMore ? 'on' : ''}" data-act="more">${svg('menu')}More${more.some(([, , n]) => n) ? '<span class="dot">•</span>' : ''}</button>
  </nav>
  ${S.moreOpen ? `<div class="more-bg" data-act="more-close"></div>
  <div class="more-sheet" role="dialog" aria-label="More">
    <div class="more-grab"></div>
    ${more.map(([id, l, n]) => `<button class="more-row ${S.page === id ? 'on' : ''}" data-go="${id}">${svg(id)}${l}${n ? `<span class="count">${n}</span>` : ''}</button>`).join('')}
    <a class="more-row" href="https://www.cvmaster.live" target="_blank" rel="noopener">${svg('ext')}Open the website</a>
    <div class="more-who">Signed in as ${esc(S.auth?.email || '')}</div>
    <button class="more-row" data-act="logout">${svg('out')}Sign out</button>
  </div>` : ''}`
}

// ── Events ────────────────────────────────────────────────────────────────────
function bind() {
  $('maint-toggle')?.addEventListener('change', toggleMaintenance)
  $('rv-show')?.addEventListener('change', e => saveReviewsShow(e.target.checked))
  $('e-subject')?.addEventListener('input', e => { S.email.subject = e.target.value; refreshPreview() })
  if ($('e-preview')) refreshPreview()   // also picks up a change of audience (newsletter vs important notice)
  $('e-plan-sel')?.addEventListener('change', e => { S.email.plan = e.target.value; S.email.important = false; render() })
  $('e-important')?.addEventListener('change', e => { S.email.important = e.target.checked })
  $('tpl-sel')?.addEventListener('change', e => { if (e.target.value) loadTemplate(e.target.value) })
  $('e-test')?.addEventListener('input', e => { S.email.testTo = e.target.value })
  $('e-people')?.addEventListener('keydown', e => {
    if (e.key !== 'Enter' && e.key !== ',') return
    e.preventDefault(); addPeople(e.target.value); e.target.value = ''
  })
  // Leaving the field adds what was typed, after the browser has finished moving focus
  $('e-people')?.addEventListener('blur', e => { const v = e.target.value.trim(); if (v) { e.target.value = ''; setTimeout(() => addPeople(v, false), 0) } })
  $('sub-f')?.addEventListener('change', (e) => { S.subFilter = e.target.value; render() })
  $('sub-q')?.addEventListener('change', (e) => { S.subQ = e.target.value.trim(); render() })
  $('e-test-btn')?.addEventListener('click', () => sendEmail(true))
  $('e-send-btn')?.addEventListener('click', async () => {
    const plan = $('e-plan-sel')?.value || 'all'
    if (plan === 'people') {
      const n = S.email.people.length
      if (!n) { toast('Add at least one person to send to.'); return }
      if (!(await ask({ title: `Send to ${n} ${n === 1 ? 'person' : 'people'}?`, message: S.email.people.slice(0, 6).join(', ') + (n > 6 ? ` and ${n - 6} more` : ''), ok: 'Send now' }))) return
    } else if (plan === 'users') {
      if (!S.email.important) { toast('Tick the box to confirm this is an important service message.'); return }
      const n = S.subs?.allUsers
      if (!(await ask({ title: 'Send to every user?', message: `This important notice goes to all ${n != null ? n + ' ' : ''}accounts right away. It can’t be undone.`, ok: 'Send to everyone', danger: true }))) return
    } else {
      const n = S.subs ? (plan === 'all' ? S.subs.counts.subscribed : plan === 'unpaid' ? S.subs.unpaid : (S.subs.byPlan[plan] || 0)) : null
      if (n === 0) { toast('No subscribers to send to yet.'); return }
      if (!(await ask({ title: 'Send this newsletter?', message: `It goes to ${n == null ? 'your subscribers' : n + ' subscriber' + (n === 1 ? '' : 's')} right away.`, ok: 'Send now' }))) return
    }
    S.email.sent = false; sendEmail(false)
  })
  $('ib-reply')?.addEventListener('input', e => { S.inbox.reply = e.target.value })
  document.querySelectorAll('[data-pf]').forEach(el => el.addEventListener(el.tagName === 'SELECT' ? 'change' : 'input', e => {
    if (!S.blog.edit) return
    S.blog.edit[el.dataset.pf] = e.target.value
    if (el.dataset.pf === 'body') refreshPostPreview()
    if (el.dataset.pf === 'category') render()
  }))
  $('pb-notify')?.addEventListener('change', e => { if (S.blog.edit) S.blog.edit.notify = e.target.checked })
  $('pb-cover-file')?.addEventListener('change', e => { const f = e.target.files?.[0]; if (f) uploadPostImage(f, 'cover') })
  $('pb-img-file')?.addEventListener('change', e => { const f = e.target.files?.[0]; if (f) uploadPostImage(f, 'body') })
  $('pb-tr')?.addEventListener('change', e => { if (e.target.value) translatePost(e.target.value) })
  if ($('pb-preview')) refreshPostPreview()
  $('p-title')?.addEventListener('input', e => { S.push.title = e.target.value })
  $('p-body')?.addEventListener('input', e => { S.push.body = e.target.value })
  document.querySelectorAll('.block-body input,.block-body textarea,.block-body select').forEach(el => {
    el.addEventListener('input', refreshPreview); el.addEventListener('change', refreshPreview)
  })
}
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-go],[data-act],[data-open],[data-ibtab],[data-ibstatus],[data-edit],[data-del],[data-page],[data-review],[data-sub]')
  if (!t) return
  if (t.dataset.review) { setReview(t.dataset.review, t.dataset.st); return }
  if (t.dataset.sub) { subAction(t.dataset.sub, t.dataset.sact, t.dataset.email); return }
  if (t.dataset.act === 'sub-export') { exportSubs(); return }
  if (t.dataset.act === 'ppl-remove') { S.email.people = S.email.people.filter(x => x !== t.dataset.email); render(); return }
  if (t.dataset.act === 'email-user') { S.email.plan = 'people'; S.email.people = [...new Set([...S.email.people, t.dataset.email])]; go('newsletter'); return }
  if (t.dataset.act === 'email-history') { loadHistory(); return }
  if (t.dataset.act === 'ib-images') { S.inbox.showImages = true; render(); return }
  if (t.dataset.act === 'pv-width') { S.pvWidth = t.dataset.w; render(); return }
  if (t.dataset.act === 'pv-dark') { S.pvDark = t.dataset.d === '1'; render(); return }
  if (t.dataset.go) { S.moreOpen = false; if (t.dataset.tab) S.inbox.tab = t.dataset.tab; go(t.dataset.go); return }
  if (t.dataset.act === 'more') { S.moreOpen = !S.moreOpen; render(); return }
  if (t.dataset.act === 'more-close') { S.moreOpen = false; render(); return }
  if (t.dataset.open) { const [k, id] = t.dataset.open.split(':'); openItem(k, id); return }
  if (t.dataset.ibtab) { S.inbox.tab = t.dataset.ibtab; render(); return }
  if (t.dataset.ibstatus) { S.inbox.status = t.dataset.ibstatus; S.inbox.sel = null; S.inbox.detail = null; loadInbox(); return }
  if (t.dataset.edit) { editCount(t.dataset.id, t.dataset.edit, t.dataset.label, t.dataset.cur); return }
  if (t.dataset.del) { deleteUser(t.dataset.del, t.dataset.email); return }
  if (t.dataset.page) { loadUsers(Number(t.dataset.page)); return }
  const a = t.dataset.act
  if (a === 'logout') logout()
  else if (a === 'stats-refresh') { S.stats = null; loadStats() }
  else if (a === 'config-refresh') { S.config = null; render(); loadConfig() }
  else if (a === 'status-refresh') loadStatus(true)
  else if (a === 'rv-min-save') saveReviewsMin()
  else if (a === 'inbox-refresh') loadInbox()
  else if (a === 'inbox-back') { S.inbox.sel = null; S.inbox.detail = null; render() }
  else if (a === 'reply') sendReply()
  else if (a === 'push-test') sendAppPush(true)
  else if (a === 'post-new') editPost(null)
  else if (a === 'post-edit') editPost(t.dataset.id)
  else if (a === 'post-back') { S.blog.edit = null; render(); loadPosts() }
  else if (a === 'post-save') savePost(t.dataset.st)
  else if (a === 'post-delete') deletePost()
  else if (a === 'post-cover-clear') { S.blog.edit.cover = ''; render() }
  else if (a === 'post-tab') { S.blog.tab = t.dataset.tab; render() }
  else if (a === 'md') {
    const k = t.dataset.md
    if (k === 'h2') insertMd('\n## ', '\n', 'Heading')
    else if (k === 'h3') insertMd('\n### ', '\n', 'Heading')
    else if (k === 'b') insertMd('**', '**', 'bold text')
    else if (k === 'i') insertMd('*', '*', 'italic text')
    else if (k === 'link') insertMd('[', '](https://)', 'link text')
    else if (k === 'ul') insertMd('\n- ', '\n', 'item')
    else if (k === 'ol') insertMd('\n1. ', '\n', 'item')
    else if (k === 'quote') insertMd('\n> ', '\n', 'quote')
  }
  else if (a === 'push-send') sendAppPush(false)
  else if (a === 'done') setItemStatus(true)
  else if (a === 'reopen') setItemStatus(false)
  else if (a === 'delete') deleteItem()
})
document.addEventListener('submit', (e) => {
  const f = e.target.dataset.form
  if (!f) return
  e.preventDefault()
  if (f === 'login') { S.login.email = $('li-email').value; S.login.password = $('li-pass').value; S.login.remember = !!$('li-remember')?.checked; login() }
  if (f === 'user-search') { S.uSearch = $('u-q').value.trim(); loadUsers(1) }
})
window.addEventListener('hashchange', () => { const p = location.hash.slice(1); if (S.auth && p && p !== S.page) go(p) })

// Newsletter builder handlers (inline onclick in its markup)
window.addBlock = addBlock; window.removeBlock = removeBlock; window.moveBlock = moveBlock
window.updateBlock = updateBlock; window.loadTemplate = loadTemplate; window.clearBlocks = clearBlocks
window.copyHtml = copyHtml; window.onDragStart = onDragStart; window.onDragEnd = onDragEnd
window.onDragOver = onDragOver; window.onDrop = onDrop

checkAuth()
</script>
</body>
