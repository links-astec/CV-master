services:
  - type: web
    name: craftcv-api
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm install && npx puppeteer browsers install chrome
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://cvmaster.live
      - key: DATABASE_URL
        fromDatabase:
          name: craftcv-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      # Set these manually in Render dashboard:
      # STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET
      # GROQ_API_KEY
      # SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS
      # ADMIN_EMAIL, ADMIN_PASSWORD
      # FRONTEND_URL (your Vercel URL)
      # GOOGLE_CLIENT_ID

databases:
  - name: craftcv-db
    databaseName: craftcv
    plan: free
    region: frankfurt