services:
  - type: web
    name: craftcv-api
    runtime: node
    region: frankfurt
    plan: free
    # Migrations are idempotent, so running them on every deploy keeps the schema current
    buildCommand: npm install && npx puppeteer browsers install chrome && node server/migrate.js
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://www.cvmaster.live
      # Postgres is hosted on Neon (Render's free Postgres expires after 30 days).
      # Paste the Neon connection string (with ?sslmode=require) in the Render dashboard.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      # Set these manually in Render dashboard:
      # STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET   (without them, exports are FREE — demo mode)
      # GROQ_API_KEY
      # SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS  (primary mailer)
      # RESEND_API_KEY, SMTP_FROM                   (fallback mailer)
      # ADMIN_EMAIL, ADMIN_PASSWORD
      # GOOGLE_CLIENT_ID
