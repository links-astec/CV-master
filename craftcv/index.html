<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="CVMaster" />
    <meta name="theme-color" content="#4338CA" />
    <meta name="description" content="Build an ATS-ready CV in minutes. Tailor it to any job offer with AI, check your ATS match, and export a one-page PDF. English and French." />

    <!-- Open Graph -->
    <meta property="og:title" content="CVMaster — AI CV Builder" />
    <meta property="og:description" content="Build an ATS-ready CV in minutes, tailored to the job you want. 12 layouts, 12 colours, English and French." />
    <meta property="og:url" content="https://cvmaster.live" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://cvmaster.live/og-image.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://cvmaster.live/og-image.png" />
    <meta name="twitter:title" content="CVMaster — AI CV Builder" />
    <meta name="twitter:description" content="Build an ATS-ready CV in minutes, tailored to the job you want." />

    <!-- Google OAuth Client ID — set VITE_GOOGLE_CLIENT_ID in your .env -->
    <meta name="google-client-id" content="%VITE_GOOGLE_CLIENT_ID%" />

    <!-- Google Identity Services SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>CVMaster — ATS-ready CVs, tailored to the job</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
