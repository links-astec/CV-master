<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="CVMaster" />
    <meta name="theme-color" content="#2a5bd7" />
    <meta name="description" content="CVMaster — AI-powered CV builder. 107 professional templates, ATS-ready PDFs, narrate your career story in minutes." />

    <!-- Open Graph -->
    <meta property="og:title" content="CVMaster — AI CV Builder" />
    <meta property="og:description" content="Build a professional, ATS-ready CV in minutes. 107 templates, AI writing, English & French." />
    <meta property="og:url" content="https://cvmaster.live" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://cvmaster.live/og-image.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CVMaster — AI CV Builder" />
    <meta name="twitter:description" content="Build a professional CV in minutes. AI-powered, ATS-ready, 107 templates." />

    <!-- Google OAuth Client ID — set VITE_GOOGLE_CLIENT_ID in your .env -->
    <meta name="google-client-id" content="%VITE_GOOGLE_CLIENT_ID%" />

    <!-- Google Identity Services SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet" />

    <title>CVMaster — AI CV Builder</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
