<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CVMaster — icon reveal</title>
<style>
html,body{margin:0;height:100%;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;background:#F5F5FA;cursor:pointer}
.wrap{width:min(180px,50vw);filter:drop-shadow(0 18px 30px rgba(67,56,202,.35));opacity:0;transform:scale(.82) translateY(10px);animation:in .9s cubic-bezier(.2,.8,.2,1) .1s forwards}
@keyframes in{to{opacity:1;transform:none}}
svg{width:100%;height:auto;display:block}
.m,.ms{stroke-dasharray:1 2;stroke-dashoffset:1;animation:draw 1.1s cubic-bezier(.6,0,.25,1) .55s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.sw{transform:translateX(-80px) skewX(-20deg);animation:sw 1s cubic-bezier(.45,0,.25,1) 1.7s forwards}
@keyframes sw{to{transform:translateX(200px) skewX(-20deg)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:1ms!important;animation-delay:0s!important}}
</style></head>
<body onclick="location.reload()">
<div class="wrap"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="CVMaster"><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6A60F2"/><stop offset=".5" stop-color="#4338CA"/><stop offset="1" stop-color="#2A2390"/></linearGradient>
<radialGradient id="glow" cx=".5" cy=".52" r=".5"><stop offset="0" stop-color="#8B85FF" stop-opacity=".55"/><stop offset="1" stop-color="#8B85FF" stop-opacity="0"/></radialGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".22"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
<linearGradient id="mk" gradientUnits="userSpaceOnUse" x1="30" y1="0" x2="104" y2="0"><stop offset=".25" stop-color="#FFFFFF"/><stop offset=".7" stop-color="#C7D2FE"/><stop offset="1" stop-color="#A5B4FC"/></linearGradient>
<filter id="sh" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur stdDeviation="3.5"/></filter>
<clipPath id="clip"><path d="M64 0C113 0 128 15 128 64S113 128 64 128 0 113 0 64 15 0 64 0Z"/></clipPath>
</defs>
<linearGradient id="swg" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<g clip-path="url(#clip)">
<path d="M64 0C113 0 128 15 128 64S113 128 64 128 0 113 0 64 15 0 64 0Z" fill="url(#bg)"/>
<rect width="128" height="128" fill="url(#glow)"/>
<rect width="128" height="128" fill="url(#sheen)"/>
<g transform="translate(20.3 35.1) scale(0.74)">
<path d="M59.9 23.3 A26 26 0 1 0 53 62.5 L104 12" transform="translate(0 6)" fill="none" stroke="#14142B" stroke-opacity=".45" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" filter="url(#sh)" class="ms" pathLength="1"></path>
<path d="M59.9 23.3 A26 26 0 1 0 53 62.5 L104 12" fill="none" stroke="url(#mk)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" class="m" pathLength="1"></path>
</g>
<path d="M64 0C113 0 128 15 128 64S113 128 64 128 0 113 0 64 15 0 64 0Z" fill="none" stroke="#FFFFFF" stroke-opacity=".22" stroke-width="2"/>
</g>
<g clip-path="url(#clip)"><rect class="sw" x="0" y="-20" width="50" height="170" fill="url(#swg)"/></g>
</svg></div>
</body></html>
